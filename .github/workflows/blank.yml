name: A135F 4.19.198 Kernel Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Source Release tag"
        required: true
        default: "v4.19.198"

      source_asset:
        description: "Samsung OpenSource ZIP asset name"
        required: true
        default: "SM-A135F_14_Opensource.1.zip"

      jobs:
        description: "Parallel build jobs"
        required: true
        default: "2"

env:
  EXPECTED_KERNEL_VERSION: "4.19.198"
  EXPECTED_DEFCONFIG: "exynos850-a13xx_defconfig"
  KERNEL_LOCALVERSION: "-MAX-ARAF"

  # Samsung/AOSP old kernel toolchain
  CLANG_RELEASE: "clang-r383902"

  # Optional SHA256 verification.
  # Leave empty unless you know the complete SHA256.
  SOURCE_SHA256: ""

  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    name: Build A135F Kernel 4.19.198
    runs-on: ubuntu-22.04

    permissions:
      contents: read

    steps:

      # ============================================================
      # 1. CHECKOUT WORKFLOW REPOSITORY
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 2. HOST DEPENDENCIES
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gcc \
            git \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            libdw-dev \
            lz4 \
            make \
            python3 \
            python3-pip \
            rsync \
            tar \
            unzip \
            zip \
            wget \
            xz-utils \
            zstd \
            binutils-aarch64-linux-gnu \
            gcc-aarch64-linux-gnu

          echo "Host dependencies installed."

      # ============================================================
      # 3. DOWNLOAD SAMSUNG SOURCE FROM RELEASE
      # ============================================================
      - name: Download Samsung OpenSource package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_ASSET: ${{ inputs.source_asset }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/source-download"

          cd "$GITHUB_WORKSPACE/source-download"

          echo "=============================================="
          echo "Release : $RELEASE_TAG"
          echo "Asset   : $SOURCE_ASSET"
          echo "=============================================="

          gh release download "$RELEASE_TAG" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "$SOURCE_ASSET" \
            --clobber

          test -f "$SOURCE_ASSET"

          echo
          echo "Downloaded:"
          ls -lh "$SOURCE_ASSET"

          echo
          echo "SHA256:"
          sha256sum "$SOURCE_ASSET"

          if [ -n "${SOURCE_SHA256}" ]; then
            echo
            echo "Checking source SHA256..."
            echo "${SOURCE_SHA256}  ${SOURCE_ASSET}" | sha256sum -c -
          fi

      # ============================================================
      # 4. EXTRACT OUTER ZIP
      # ============================================================
      - name: Extract OpenSource package
        shell: bash
        run: |
          set -euo pipefail

          DOWNLOAD_DIR="$GITHUB_WORKSPACE/source-download"
          OUTER_DIR="$GITHUB_WORKSPACE/outer-source"

          rm -rf "$OUTER_DIR"
          mkdir -p "$OUTER_DIR"

          SOURCE_ASSET="${{ inputs.source_asset }}"

          echo "Extracting:"
          echo "$SOURCE_ASSET"

          unzip -q "$DOWNLOAD_DIR/$SOURCE_ASSET" -d "$OUTER_DIR"

          echo
          echo "Outer package contents:"
          find "$OUTER_DIR" -maxdepth 4 -type f \
            \( -name "*.tar.gz" -o -name "*.txt" -o -name "*.zip" \) \
            -print | sort

      # ============================================================
      # 5. FIND Kernel.tar.gz AUTOMATICALLY
      # ============================================================
      - name: Locate Kernel.tar.gz
        id: kernel_archive
        shell: bash
        run: |
          set -euo pipefail

          OUTER_DIR="$GITHUB_WORKSPACE/outer-source"

          mapfile -d '' KERNEL_ARCHIVES < <(
            find "$OUTER_DIR" \
              -type f \
              \( -name "Kernel.tar.gz" -o -name "Kernel.tar" \) \
              -print0
          )

          if [ "${#KERNEL_ARCHIVES[@]}" -eq 0 ]; then
            echo "::error::Kernel.tar.gz was not found inside Samsung OpenSource package."
            echo
            echo "All files:"
            find "$OUTER_DIR" -type f -print | sort
            exit 1
          fi

          KERNEL_ARCHIVE="${KERNEL_ARCHIVES[0]}"

          echo "Found kernel archive:"
          echo "$KERNEL_ARCHIVE"

          echo "kernel_archive=$KERNEL_ARCHIVE" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 6. EXTRACT REAL KERNEL SOURCE
      # ============================================================
      - name: Extract kernel source
        shell: bash
        env:
          KERNEL_ARCHIVE: ${{ steps.kernel_archive.outputs.kernel_archive }}
        run: |
          set -euo pipefail

          KERNEL_UNPACK="$GITHUB_WORKSPACE/kernel-unpack"

          rm -rf "$KERNEL_UNPACK"
          mkdir -p "$KERNEL_UNPACK"

          echo "Extracting kernel:"
          echo "$KERNEL_ARCHIVE"

          tar -xzf "$KERNEL_ARCHIVE" -C "$KERNEL_UNPACK"

          echo
          echo "Kernel archive extracted."

          echo
          echo "Top-level directories:"
          find "$KERNEL_UNPACK" -maxdepth 2 -type d -print | sort | head -100

      # ============================================================
      # 7. SMART KERNEL ROOT DETECTION
      # ============================================================
      - name: Detect kernel root
        id: detect_kernel
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/kernel-unpack"

          echo "Searching for Samsung kernel root..."
          echo

          CANDIDATE=""

          while IFS= read -r -d '' MAKEFILE; do
            DIR="$(dirname "$MAKEFILE")"

            # Must have arch/arm64
            [ -d "$DIR/arch/arm64" ] || continue

            # Must have an ARM64 kernel config directory
            [ -d "$DIR/arch/arm64/configs" ] || continue

            # Must have Linux kernel Makefile fields
            if ! grep -qE '^[[:space:]]*VERSION[[:space:]]*=' "$MAKEFILE"; then
              continue
            fi

            if ! grep -qE '^[[:space:]]*PATCHLEVEL[[:space:]]*=' "$MAKEFILE"; then
              continue
            fi

            if ! grep -qE '^[[:space:]]*SUBLEVEL[[:space:]]*=' "$MAKEFILE"; then
              continue
            fi

            # Prefer the exact A135F defconfig
            if [ -f "$DIR/arch/arm64/configs/$EXPECTED_DEFCONFIG" ]; then
              CANDIDATE="$DIR"
              break
            fi

            # Backup candidate
            if [ -z "$CANDIDATE" ]; then
              CANDIDATE="$DIR"
            fi

          done < <(
            find "$ROOT" \
              -type f \
              -name "Makefile" \
              -print0
          )

          if [ -z "$CANDIDATE" ]; then
            echo "::error::No valid Linux kernel root found."
            find "$ROOT" -maxdepth 5 -type f | sort | head -500
            exit 1
          fi

          echo
          echo "=============================================="
          echo "SELECTED KERNEL ROOT"
          echo "=============================================="
          echo "$CANDIDATE"

          echo "kernel_dir=$CANDIDATE" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 8. VERIFY KERNEL VERSION
      # ============================================================
      - name: Verify Linux 4.19.198 source
        shell: bash
        env:
          KERNEL_DIR: ${{ steps.detect_kernel.outputs.kernel_dir }}
        run: |
          set -euo pipefail

          cd "$KERNEL_DIR"

          VERSION="$(awk '$1=="VERSION" {print $3; exit}' Makefile)"
          PATCHLEVEL="$(awk '$1=="PATCHLEVEL" {print $3; exit}' Makefile)"
          SUBLEVEL="$(awk '$1=="SUBLEVEL" {print $3; exit}' Makefile)"
          EXTRAVERSION="$(awk '$1=="EXTRAVERSION" {print $3; exit}' Makefile || true)"

          EXTRAVERSION="${EXTRAVERSION:-}"

          KERNEL_VERSION="${VERSION}.${PATCHLEVEL}.${SUBLEVEL}${EXTRAVERSION}"

          echo "VERSION      = $VERSION"
          echo "PATCHLEVEL   = $PATCHLEVEL"
          echo "SUBLEVEL     = $SUBLEVEL"
          echo "EXTRAVERSION = $EXTRAVERSION"
          echo
          echo "Detected kernel version: $KERNEL_VERSION"

          if [ "$KERNEL_VERSION" != "$EXPECTED_KERNEL_VERSION" ]; then
            echo "::error::Wrong kernel version."
            echo "Expected: $EXPECTED_KERNEL_VERSION"
            echo "Found   : $KERNEL_VERSION"
            exit 1
          fi

          echo
          echo "Kernel version verification PASSED."

      # ============================================================
      # 9. VERIFY DEFCONFIG
      # ============================================================
      - name: Verify A135F defconfig
        shell: bash
        env:
          KERNEL_DIR: ${{ steps.detect_kernel.outputs.kernel_dir }}
        run: |
          set -euo pipefail

          cd "$KERNEL_DIR"

          CONFIG_DIR="arch/arm64/configs"

          echo "Available Exynos850 configs:"
          find "$CONFIG_DIR" \
            -maxdepth 1 \
            -type f \
            -name "*exynos850*" \
            -printf "%f\n" \
            | sort || true

          echo

          if [ ! -f "$CONFIG_DIR/$EXPECTED_DEFCONFIG" ]; then
            echo "::error::Expected defconfig not found:"
            echo "$EXPECTED_DEFCONFIG"

            echo
            echo "Matching configs:"
            find "$CONFIG_DIR" \
              -maxdepth 1 \
              -type f \
              -iname "*a13*" \
              -printf "%f\n" \
              | sort || true

            exit 1
          fi

          echo "Defconfig found:"
          echo "$CONFIG_DIR/$EXPECTED_DEFCONFIG"

      # ============================================================
      # 10. SHOW ORIGINAL TOOLCHAIN REFERENCES
      # ============================================================
      - name: Inspect Samsung toolchain references
        shell: bash
        env:
          KERNEL_DIR: ${{ steps.detect_kernel.outputs.kernel_dir }}
        run: |
          set -euo pipefail

          cd "$KERNEL_DIR"

          echo "=============================================="
          echo "ORIGINAL TOOLCHAIN REFERENCES"
          echo "=============================================="

          grep -nE \
            'clang-r[0-9]+|CROSS_COMPILE|CLANG_TRIPLE|CLANG_PATH' \
            Makefile \
            2>/dev/null || true

          echo
          echo "=============================================="
          echo "KERNEL VERSION FIELDS"
          echo "=============================================="

          grep -nE \
            '^[[:space:]]*(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' \
            Makefile \
            || true

      # ============================================================
      # 11. DOWNLOAD AOSP CLANG r383902
      # ============================================================
      - name: Download Android Clang r383902
        id: clang
        shell: bash
        run: |
          set -euo pipefail

          TOOLCHAIN_DIR="$GITHUB_WORKSPACE/toolchains"
          CLANG_DIR="$TOOLCHAIN_DIR/$CLANG_RELEASE"

          mkdir -p "$TOOLCHAIN_DIR"

          if [ ! -x "$CLANG_DIR/bin/clang" ]; then

            TMP="$TOOLCHAIN_DIR/clang-r383902.tar.gz"

            echo "Downloading Android Clang:"
            echo "$CLANG_RELEASE"

            curl -L \
              --fail \
              --retry 5 \
              --retry-delay 3 \
              -o "$TMP" \
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/$CLANG_RELEASE.tar.gz"

            mkdir -p "$CLANG_DIR"

            tar -xzf "$TMP" -C "$CLANG_DIR"

            rm -f "$TMP"
          fi

          if [ ! -x "$CLANG_DIR/bin/clang" ]; then
            echo "::error::clang-r383902 installation failed."

            echo "Searching for clang:"
            find "$TOOLCHAIN_DIR" \
              -type f \
              -name clang \
              -o -name clang-10 \
              | sort || true

            exit 1
          fi

          echo
          echo "Clang path:"
          echo "$CLANG_DIR/bin"

          echo
          echo "Clang version:"
          "$CLANG_DIR/bin/clang" --version

          echo "clang_bin=$CLANG_DIR/bin" >> "$GITHUB_OUTPUT"

            # ============================================================
            # ============================================================
      # 12. PREPARE SAMSUNG TOOLCHAIN COMPATIBILITY
      # ============================================================
      - name: Prepare Samsung toolchain compatibility
        shell: bash
        env:
          KERNEL_DIR: ${{ steps.detect_kernel.outputs.kernel_dir }}
        run: |
          set -euo pipefail

          cd "$KERNEL_DIR"

          echo "=============================================="
          echo "SAMSUNG TOOLCHAIN COMPATIBILITY"
          echo "=============================================="

          # Downloaded clang location
          REAL_CLANG_DIR="$GITHUB_WORKSPACE/toolchains/clang-r383902"

          # Samsung source expects this exact location
          SAMSUNG_CLANG_DIR="$KERNEL_DIR/toolchain/clang/host/linux-x86/clang-r383902"

          echo "Real clang:"
          echo "$REAL_CLANG_DIR"

          echo "Samsung expected clang:"
          echo "$SAMSUNG_CLANG_DIR"

          # Verify downloaded compiler
          if [ ! -x "$REAL_CLANG_DIR/bin/clang" ]; then
            echo "::error::clang-r383902 was not found."
            echo "Expected:"
            echo "$REAL_CLANG_DIR/bin/clang"
            exit 1
          fi

          # Remove old/broken path if present
          rm -rf "$SAMSUNG_CLANG_DIR"

          # Create parent directory
          mkdir -p "$(dirname "$SAMSUNG_CLANG_DIR")"

          # Create compatibility symlink
          ln -s "$REAL_CLANG_DIR" "$SAMSUNG_CLANG_DIR"

          echo
          echo "Checking Samsung clang path..."

          if [ ! -x "$SAMSUNG_CLANG_DIR/bin/clang" ]; then
            echo "::error::Samsung clang compatibility path failed."
            exit 1
          fi

          "$SAMSUNG_CLANG_DIR/bin/clang" --version

          echo
          echo "=============================================="
          echo "TOOLCHAIN READY"
          echo "=============================================="

          echo "clang:"
          "$SAMSUNG_CLANG_DIR/bin/clang" --version | head -1

          echo
          echo "clang path:"
          readlink -f "$SAMSUNG_CLANG_DIR/bin/clang"


      # ============================================================
      # 13. CONFIGURE KERNEL
      # ============================================================
      - name: Configure kernel
        shell: bash
        env:
          KERNEL_DIR: ${{ steps.detect_kernel.outputs.kernel_dir }}
        run: |
          set -euo pipefail

          cd "$KERNEL_DIR"

          SAMSUNG_CLANG_DIR="$KERNEL_DIR/toolchain/clang/host/linux-x86/clang-r383902"

          export PATH="$SAMSUNG_CLANG_DIR/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          export PLATFORM_VERSION=14
          export ANDROID_MAJOR_VERSION=u

          export CROSS_COMPILE=aarch64-linux-android-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          export CC="$SAMSUNG_CLANG_DIR/bin/clang"

          echo "=============================================="
          echo "CONFIGURING A135F 4.19.198"
          echo "=============================================="

          echo
          echo "Kernel root:"
          pwd

          echo
          echo "Defconfig:"
          echo "$EXPECTED_DEFCONFIG"

          echo
          echo "Compiler:"
          "$CC" --version | head -1

          # --------------------------------------------------------
          # DO NOT RUN MRPROPER
          # Fresh Samsung source is already extracted.
          # --------------------------------------------------------

          rm -f .config

          if [ -f include/config/auto.conf ]; then
            rm -f include/config/auto.conf
          fi

          echo
          echo "Running defconfig..."

          make \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CC="$CC" \
            LLVM=1 \
            LLVM_IAS=1 \
            "$EXPECTED_DEFCONFIG"

          echo
          echo "=============================================="
          echo "DEFCONFIG SUCCESS"
          echo "=============================================="

          test -f .config

          echo
          echo "Checking important configuration..."

          grep -E \
            'CONFIG_ARM64=|CONFIG_ARCH_EXYNOS=|CONFIG_EXYNOS850=' \
            .config || true

          echo
          echo "Checking kernel version..."

          KREL="$(
            make \
              ARCH=arm64 \
              CROSS_COMPILE="$CROSS_COMPILE" \
              CLANG_TRIPLE="$CLANG_TRIPLE" \
              CC="$CC" \
              LLVM=1 \
              LLVM_IAS=1 \
              LOCALVERSION="$KERNEL_LOCALVERSION" \
              kernelrelease
          )"

          echo
          echo "Kernel release:"
          echo "$KREL"

          case "$KREL" in
            4.19.198*)
              echo "Kernel release verification PASSED."
              ;;
            *)
              echo "::error::Unexpected kernel release: $KREL"
              exit 1
              ;;
          esac


      # ============================================================
      # 13. CONFIGURE KERNEL
      # ============================================================
      - name: Configure kernel
        shell: bash
        env:
          KERNEL_DIR: ${{ steps.detect_kernel.outputs.kernel_dir }}
          CLANG_BIN: ${{ steps.clang.outputs.clang_bin }}
        run: |
          set -euo pipefail

          cd "$KERNEL_DIR"

          EXPECTED_CLANG_DIR="$KERNEL_DIR/toolchain/clang/host/linux-x86/clang-r383902"

          export PATH="$EXPECTED_CLANG_DIR/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          export PLATFORM_VERSION=14
          export ANDROID_MAJOR_VERSION=u

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          export CC="$EXPECTED_CLANG_DIR/bin/clang"

          echo "=============================================="
          echo "CONFIGURING A135F KERNEL"
          echo "=============================================="

          echo
          echo "Kernel root:"
          pwd

          echo
          echo "Defconfig:"
          echo "$EXPECTED_DEFCONFIG"

          # --------------------------------------------------------
          # IMPORTANT:
          # DO NOT RUN make mrproper HERE.
          #
          # Source was freshly extracted from Samsung archive.
          # mrproper was causing missing vendor Makefile errors.
          # --------------------------------------------------------

          if [ -f .config ]; then
            echo "Removing previous .config only..."
            rm -f .config
          fi

          if [ -f include/config/auto.conf ]; then
            rm -f include/config/auto.conf
          fi

          echo
          echo "Running Samsung defconfig..."

          make \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CC="$CC" \
            LLVM=1 \
            LLVM_IAS=1 \
            "$EXPECTED_DEFCONFIG"

          echo
          echo "=============================================="
          echo "DEFCONFIG SUCCESS"
          echo "=============================================="

          test -f .config

          echo
          echo "Checking generated config..."

          grep -E \
            'CONFIG_ARM64=|CONFIG_ARCH_EXYNOS=|CONFIG_EXYNOS850=' \
            .config \
            || true

          echo
          echo "Checking kernel release..."

          KREL="$(
            make \
              ARCH=arm64 \
              CROSS_COMPILE="$CROSS_COMPILE" \
              CLANG_TRIPLE="$CLANG_TRIPLE" \
              CC="$CC" \
              LLVM=1 \
              LLVM_IAS=1 \
              LOCALVERSION="$KERNEL_LOCALVERSION" \
              kernelrelease
          )"

          echo
          echo "Kernel release:"
          echo "$KREL"

          case "$KREL" in
            4.19.198*)
              echo "Kernel release OK."
              ;;
            *)
              echo "::error::Unexpected kernel release: $KREL"
              exit 1
              ;;
          esac
          # Samsung GCC compatibility path
          EXPECTED_GCC_DIR="$KERNEL_DIR/toolchain/gcc/linux-x86/aarch64-linux-android-4.9"

          if [ ! -d "$EXPECTED_GCC_DIR" ]; then
          echo
          echo "Samsung GCC 4.9 directory is not present."
          echo "LLVM build will be attempted first."
          fi

      # ============================================================
      # 13. CLEAN + DEFCONFIG
      # ============================================================
      - name: Configure kernel
        shell: bash
        env:
          KERNEL_DIR: ${{ steps.detect_kernel.outputs.kernel_dir }}
          CLANG_BIN: ${{ steps.clang.outputs.clang_bin }}
        run: |
          set -euo pipefail

          cd "$KERNEL_DIR"

          export PATH="$CLANG_BIN:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          export PLATFORM_VERSION=14
          export ANDROID_MAJOR_VERSION=u

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          export CC="$CLANG_BIN/clang"

          echo "Cleaning previous configuration..."
          make mrproper

          echo
          echo "Running defconfig:"
          echo "$EXPECTED_DEFCONFIG"

          make \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CC="$CC" \
            LLVM=1 \
            LLVM_IAS=1 \
            "$EXPECTED_DEFCONFIG"

          echo
          echo "Config generated successfully."

          test -f .config

          echo
          echo "Kernel local version:"
          make \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CC="$CC" \
            LLVM=1 \
            LLVM_IAS=1 \
            kernelrelease \
            LOCALVERSION="$KERNEL_LOCALVERSION"

      # ============================================================
      # 14. BUILD
      # ============================================================
      - name: Build kernel
        shell: bash
        env:
          KERNEL_DIR: ${{ steps.detect_kernel.outputs.kernel_dir }}
          CLANG_BIN: ${{ steps.clang.outputs.clang_bin }}
        run: |
          set -euo pipefail

          cd "$KERNEL_DIR"

          export PATH="$CLANG_BIN:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          export PLATFORM_VERSION=14
          export ANDROID_MAJOR_VERSION=u

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          export CC="$CLANG_BIN/clang"

          JOBS="${{ inputs.jobs }}"

          if ! [[ "$JOBS" =~ ^[0-9]+$ ]]; then
            JOBS=2
          fi

          echo "=============================================="
          echo "STARTING KERNEL BUILD"
          echo "Jobs: $JOBS"
          echo "=============================================="

          make \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CC="$CC" \
            LLVM=1 \
            LLVM_IAS=1 \
            LOCALVERSION="$KERNEL_LOCALVERSION" \
            -j"$JOBS" \
            2>&1 | tee "$GITHUB_WORKSPACE/kernel-build.log"

      # ============================================================
      # 15. POST-BUILD VERIFICATION
      # ============================================================
      - name: Verify kernel output
        shell: bash
        env:
          KERNEL_DIR: ${{ steps.detect_kernel.outputs.kernel_dir }}
          CLANG_BIN: ${{ steps.clang.outputs.clang_bin }}
        run: |
          set -euo pipefail

          cd "$KERNEL_DIR"

          export PATH="$CLANG_BIN:$PATH"

          echo "=============================================="
          echo "BUILD OUTPUT"
          echo "=============================================="

          find arch/arm64/boot \
            -maxdepth 4 \
            -type f \
            | sort \
            | head -300

          echo
          echo "Checking Image..."

          if [ ! -f arch/arm64/boot/Image ]; then
            echo "::error::arch/arm64/boot/Image was not generated."
            exit 1
          fi

          IMAGE_SIZE="$(stat -c%s arch/arm64/boot/Image)"

          echo "Image size: $IMAGE_SIZE bytes"

          if [ "$IMAGE_SIZE" -lt 1000000 ]; then
            echo "::error::Image is suspiciously small."
            exit 1
          fi

          echo
          echo "Checking kernelrelease..."

          KERNEL_RELEASE="$(
            make \
              ARCH=arm64 \
              CROSS_COMPILE=aarch64-linux-gnu- \
              CLANG_TRIPLE=aarch64-linux-gnu- \
              CC="$CLANG_BIN/clang" \
              LLVM=1 \
              LLVM_IAS=1 \
              kernelrelease \
              LOCALVERSION="$KERNEL_LOCALVERSION"
          )"

          echo "Kernel release: $KERNEL_RELEASE"

          case "$KERNEL_RELEASE" in
            4.19.198*)
              echo "Kernel release verification PASSED."
              ;;
            *)
              echo "::error::Unexpected kernelrelease: $KERNEL_RELEASE"
              exit 1
              ;;
          esac

          echo "$KERNEL_RELEASE" > "$GITHUB_WORKSPACE/kernel-release.txt"

      # ============================================================
      # 16. PACKAGE BUILD OUTPUT
      # ============================================================
      - name: Package kernel output
        shell: bash
        env:
          KERNEL_DIR: ${{ steps.detect_kernel.outputs.kernel_dir }}
        run: |
          set -euo pipefail

          PACKAGE="$GITHUB_WORKSPACE/A135F-Kernel-4.19.198-MAX-ARAF"

          rm -rf "$PACKAGE"
          mkdir -p "$PACKAGE"

          echo "Copying Image..."
          cp "$KERNEL_DIR/arch/arm64/boot/Image" \
            "$PACKAGE/Image"

          echo "Copying config..."
          cp "$KERNEL_DIR/.config" \
            "$PACKAGE/config"

          if [ -f "$KERNEL_DIR/System.map" ]; then
            cp "$KERNEL_DIR/System.map" \
              "$PACKAGE/System.map"
          fi

          if [ -f "$KERNEL_DIR/Module.symvers" ]; then
            cp "$KERNEL_DIR/Module.symvers" \
              "$PACKAGE/Module.symvers"
          fi

          if [ -f "$KERNEL_DIR/vmlinux" ]; then
            cp "$KERNEL_DIR/vmlinux" \
              "$PACKAGE/vmlinux"
          fi

          echo "Copying DTB files..."

          mkdir -p "$PACKAGE/dtb"

          find "$KERNEL_DIR/arch/arm64/boot" \
            -type f \
            \( -name "*.dtb" -o -name "*.dtbo" \) \
            -exec cp --parents {} "$PACKAGE/dtb/" \; \
            2>/dev/null || true

          if [ -f "$KERNEL_DIR/arch/arm64/boot/dtbo.img" ]; then
            cp "$KERNEL_DIR/arch/arm64/boot/dtbo.img" \
              "$PACKAGE/dtbo.img"
          fi

          cp "$GITHUB_WORKSPACE/kernel-release.txt" \
            "$PACKAGE/kernel-release.txt"

          cat > "$PACKAGE/BUILD_INFO.txt" <<EOF
          Device: Samsung Galaxy A13 SM-A135F
          Kernel source: Official Samsung OpenSource
          Kernel version: 4.19.198
          Local version: -MAX-ARAF
          Defconfig: exynos850-a13xx_defconfig
          Compiler: Android Clang r383902
          Architecture: arm64
          Build system: GitHub Actions
          EOF

          echo
          echo "=============================================="
          echo "PACKAGE CONTENTS"
          echo "=============================================="

          find "$PACKAGE" -type f -printf "%p %s bytes\n" | sort

          cd "$GITHUB_WORKSPACE"

          zip -r -9 \
            "A135F-Kernel-4.19.198-MAX-ARAF.zip" \
            "$(basename "$PACKAGE")"

          echo
          echo "Final ZIP:"
          ls -lh "A135F-Kernel-4.19.198-MAX-ARAF.zip"

      # ============================================================
      # 17. UPLOAD ARTIFACTS
      # ============================================================
      - name: Upload kernel ZIP
        uses: actions/upload-artifact@v4
        with:
          name: A135F-Kernel-4.19.198-MAX-ARAF
          path: |
            A135F-Kernel-4.19.198-MAX-ARAF.zip
            kernel-build.log
            kernel-release.txt
          if-no-files-found: error
          compression-level: 0

      # ============================================================
      # 18. BUILD SUMMARY
      # ============================================================
      - name: Build summary
        shell: bash
        env:
          KERNEL_DIR: ${{ steps.detect_kernel.outputs.kernel_dir }}
        run: |
          set -euo pipefail

          {
            echo "## A135F Kernel Build"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Device | Samsung Galaxy A13 SM-A135F |"
            echo "| Source | Official Samsung OpenSource |"
            echo "| Kernel | 4.19.198 |"
            echo "| Defconfig | exynos850-a13xx_defconfig |"
            echo "| Localversion | -MAX-ARAF |"
            echo "| Clang | r383902 |"
            echo "| Architecture | arm64 |"
            echo "| Result | ✅ BUILD SUCCESS |"
          } >> "$GITHUB_STEP_SUMMARY"
