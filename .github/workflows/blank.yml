name: A135F 4.19.198 MAX-ARAF Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ARCH: arm64

  EXPECTED_KERNEL_VERSION: "4.19.198"
  EXPECTED_DEFCONFIG: "exynos850-a13xx_defconfig"

  KERNEL_LOCALVERSION: "-MAX-ARAF"

  CLANG_VERSION: "clang-r383902"
  CLANG_BRANCH: "android12-release"

  SOURCE_DIR: "kernel-source"
  OUT_DIR: "out"

  BUILD_JOBS: "4"

jobs:

  build:
    name: Build A135F Kernel
    runs-on: ubuntu-22.04

    steps:

    # ------------------------------------------------------------
    # 1. Checkout
    # ------------------------------------------------------------
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    # ------------------------------------------------------------
    # 2. Install dependencies
    # ------------------------------------------------------------
    - name: Install build dependencies
      shell: bash
      run: |
        set -euxo pipefail

        sudo apt-get update

        sudo apt-get install -y \
          bc \
          bison \
          build-essential \
          ccache \
          cpio \
          curl \
          flex \
          git \
          libelf-dev \
          libssl-dev \
          lz4 \
          rsync \
          unzip \
          wget \
          xz-utils \
          zip

    # ------------------------------------------------------------
    # 3. Locate kernel source automatically
    # ------------------------------------------------------------
    - name: Locate and validate kernel source
      shell: bash
      run: |
        set -euo pipefail

        echo "=============================================="
        echo " A135F KERNEL SOURCE DISCOVERY"
        echo "=============================================="

        ROOT="${GITHUB_WORKSPACE}"

        candidates=()

        # Preferred location
        if [ -f "$ROOT/kernel-source/Makefile" ]; then
          candidates+=("$ROOT/kernel-source")
        fi

        # Repository root
        if [ -f "$ROOT/Makefile" ]; then
          candidates+=("$ROOT")
        fi

        # Automatic search
        while IFS= read -r -d '' cfg; do

          d="$(dirname "$cfg")"

          kernel_root="$(dirname \
            "$(dirname \
              "$(dirname "$d")"
            )"
          )"

          if [ -f "$kernel_root/Makefile" ]; then
            candidates+=("$kernel_root")
          fi

        done < <(
          find "$ROOT" \
            -type f \
            -path '*/arch/arm64/configs/*defconfig' \
            -print0 \
            2>/dev/null
        )

        # Remove duplicates
        mapfile -t candidates < <(
          printf '%s\n' "${candidates[@]}" |
          awk '!seen[$0]++'
        )

        echo
        echo "Candidate kernel roots:"
        printf '  %s\n' "${candidates[@]:-NONE}"

        kernel_dir=""

        for dir in "${candidates[@]}"; do

          [ -f "$dir/Makefile" ] || continue
          [ -d "$dir/arch/arm64" ] || continue

          version="$(
            awk '$1=="VERSION" {print $3}' "$dir/Makefile" |
            head -n1
          )"

          patchlevel="$(
            awk '$1=="PATCHLEVEL" {print $3}' "$dir/Makefile" |
            head -n1
          )"

          sublevel="$(
            awk '$1=="SUBLEVEL" {print $3}' "$dir/Makefile" |
            head -n1
          )"

          kernel_version="${version}.${patchlevel}.${sublevel}"

          echo
          echo "Checking:"
          echo "  $dir"
          echo "  version = $kernel_version"

          if [ "$kernel_version" = "$EXPECTED_KERNEL_VERSION" ]; then
            kernel_dir="$dir"
            break
          fi

        done

        if [ -z "$kernel_dir" ]; then

          echo
          echo "::error::No matching $EXPECTED_KERNEL_VERSION kernel source found."

          echo
          echo "Available kernel versions:"

          for dir in "${candidates[@]}"; do

            [ -f "$dir/Makefile" ] || continue

            v="$(
              awk '$1=="VERSION" {print $3}' "$dir/Makefile" |
              head -n1
            )"

            p="$(
              awk '$1=="PATCHLEVEL" {print $3}' "$dir/Makefile" |
              head -n1
            )"

            s="$(
              awk '$1=="SUBLEVEL" {print $3}' "$dir/Makefile" |
              head -n1
            )"

            echo "  $dir -> $v.$p.$s"

          done

          exit 1
        fi

        echo
        echo "=============================================="
        echo " SELECTED KERNEL"
        echo "=============================================="

        echo "KERNEL_DIR=$kernel_dir"

        # Find requested defconfig
        defconfig=""

        if [ -f "$kernel_dir/arch/arm64/configs/$EXPECTED_DEFCONFIG" ]; then
          defconfig="$EXPECTED_DEFCONFIG"
        fi

        # Automatic fallback
        if [ -z "$defconfig" ]; then

          mapfile -t defs < <(
            find "$kernel_dir/arch/arm64/configs" \
              -maxdepth 1 \
              -type f \
              -name '*defconfig' \
              -printf '%f\n' |
            sort
          )

          echo
          echo "Available defconfigs:"
          printf '  %s\n' "${defs[@]:-NONE}"

          # Search Exynos850/A13 candidates
          for d in "${defs[@]}"; do
            case "$d" in
              *exynos850*a13*|*a13*exynos850*)
                defconfig="$d"
                break
                ;;
            esac
          done
        fi

        if [ -z "$defconfig" ]; then
          echo "::error::No suitable A135F/Exynos850 defconfig found."
          exit 1
        fi

        echo "DEFCONFIG=$defconfig"

        # Export for following steps
        {
          echo "KERNEL_DIR=$kernel_dir"
          echo "DEFCONFIG=$defconfig"
          echo "KERNEL_VERSION=$EXPECTED_KERNEL_VERSION"
        } >> "$GITHUB_ENV"

    # ------------------------------------------------------------
    # 4. Print source information
    # ------------------------------------------------------------
    - name: Inspect kernel source
      shell: bash
      run: |
        set -euo pipefail

        cd "$KERNEL_DIR"

        echo "=============================================="
        echo " KERNEL SOURCE INFORMATION"
        echo "=============================================="

        echo
        echo "Kernel version:"
        make kernelversion

        echo
        echo "Makefile version fields:"
        grep -E \
          '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' \
          Makefile || true

        echo
        echo "Architecture:"
        grep -E \
          '^(ARCH|SUBARCH|CROSS_COMPILE|CLANG_TRIPLE|CC)[[:space:]]*=' \
          Makefile || true

        echo
        echo "Defconfig:"
        ls -lh "arch/arm64/configs/$DEFCONFIG"

        echo
        echo "Possible Samsung toolchains:"
        find . \
          -maxdepth 8 \
          \( \
            -iname '*clang-r*' \
            -o \
            -iname '*gcc*' \
          \) \
          -print 2>/dev/null |
          head -100 || true

    # ------------------------------------------------------------
    # 5. Download exact AOSP Clang
    # ------------------------------------------------------------
    - name: Download Clang r383902
      shell: bash
      run: |
        set -euo pipefail

        TOOLCHAIN="$RUNNER_TEMP/aosp-clang"

        mkdir -p "$TOOLCHAIN"

        echo "Downloading AOSP $CLANG_VERSION..."

        git clone \
          --depth=1 \
          --filter=blob:none \
          --sparse \
          --branch="$CLANG_BRANCH" \
          https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86.git \
          "$TOOLCHAIN"

        cd "$TOOLCHAIN"

        git sparse-checkout set \
          "$CLANG_VERSION"

        if [ ! -x "$TOOLCHAIN/$CLANG_VERSION/bin/clang" ]; then
          echo "::error::clang-r383902 was not found."
          exit 1
        fi

        echo "CLANG_PATH=$TOOLCHAIN/$CLANG_VERSION/bin" >> "$GITHUB_ENV"

        echo
        echo "Compiler:"
        "$TOOLCHAIN/$CLANG_VERSION/bin/clang" --version

    # ------------------------------------------------------------
    # 6. Prepare cross compiler
    # ------------------------------------------------------------
    - name: Prepare cross compiler
      shell: bash
      run: |
        set -euo pipefail

        echo "=============================================="
        echo " CROSS COMPILER"
        echo "=============================================="

        CLANG="$CLANG_PATH/clang"

        # Modern LLVM can generate the ARM64 kernel directly.
        #
        # We still provide a GNU-style CROSS_COMPILE prefix
        # because old Android kernel Makefiles expect it.

        if [ -x "$CLANG_PATH/llvm-ar" ]; then
          echo "LLVM tools detected."
        fi

        echo "CLANG=$CLANG"
        echo "CLANG_PATH=$CLANG_PATH"

        echo "CLANG_PATH=$CLANG_PATH" >> "$GITHUB_ENV"

    # ------------------------------------------------------------
    # 7. Clean build directory
    # ------------------------------------------------------------
    - name: Prepare build directory
      shell: bash
      run: |
        set -euo pipefail

        rm -rf "$GITHUB_WORKSPACE/$OUT_DIR"

        mkdir -p "$GITHUB_WORKSPACE/$OUT_DIR"

        echo "OUT=$GITHUB_WORKSPACE/$OUT_DIR" >> "$GITHUB_ENV"

    # ------------------------------------------------------------
    # 8. Configure kernel
    # ------------------------------------------------------------
    - name: Configure kernel
      shell: bash
      run: |
        set -euo pipefail

        cd "$KERNEL_DIR"

        export ARCH=arm64
        export SUBARCH=arm64

        export LLVM="$CLANG_PATH/"
        export LLVM_IAS=1

        echo "=============================================="
        echo " CONFIGURING KERNEL"
        echo "=============================================="

        make \
          O="$OUT" \
          ARCH=arm64 \
          LLVM="$CLANG_PATH/" \
          LLVM_IAS=1 \
          "$DEFCONFIG"

        echo
        echo "Configuration generated."

        if [ ! -f "$OUT/.config" ]; then
          echo "::error::.config was not generated."
          exit 1
        fi

    # ------------------------------------------------------------
    # 9. Apply optional modifications
    # ------------------------------------------------------------
    - name: Apply kernel modifications
      shell: bash
      run: |
        set -euo pipefail

        if [ -f "$GITHUB_WORKSPACE/patches/apply.sh" ]; then

          echo "Applying custom modifications..."

          chmod +x "$GITHUB_WORKSPACE/patches/apply.sh"

          "$GITHUB_WORKSPACE/patches/apply.sh" \
            "$KERNEL_DIR" \
            "$OUT"

        else

          echo "No patches/apply.sh found."
          echo "Building clean Samsung source."

        fi

    # ------------------------------------------------------------
    # 10. Re-check configuration
    # ------------------------------------------------------------
    - name: Validate final configuration
      shell: bash
      run: |
        set -euo pipefail

        cd "$KERNEL_DIR"

        echo "=============================================="
        echo " FINAL CONFIG CHECK"
        echo "=============================================="

        scripts/config \
          --file "$OUT/.config" \
          --enable CONFIG_MODULES 2>/dev/null || true

        echo
        echo "Kernel release:"
        make \
          O="$OUT" \
          ARCH=arm64 \
          LLVM="$CLANG_PATH/" \
          LLVM_IAS=1 \
          kernelrelease || true

    # ------------------------------------------------------------
    # 11. Build kernel
    # ------------------------------------------------------------
    - name: Build kernel
      shell: bash
      run: |
        set -euo pipefail

        cd "$KERNEL_DIR"

        export ARCH=arm64
        export SUBARCH=arm64

        echo "=============================================="
        echo " BUILDING KERNEL"
        echo "=============================================="

        echo
        echo "Compiler:"
        "$CLANG_PATH/clang" --version | head -n3

        echo
        echo "Jobs: $BUILD_JOBS"

        make \
          O="$OUT" \
          ARCH=arm64 \
          LLVM="$CLANG_PATH/" \
          LLVM_IAS=1 \
          LOCALVERSION="$KERNEL_LOCALVERSION" \
          -j"$BUILD_JOBS"

    # ------------------------------------------------------------
    # 12. Verify output
    # ------------------------------------------------------------
    - name: Verify kernel output
      shell: bash
      run: |
        set -euo pipefail

        echo "=============================================="
        echo " BUILD OUTPUT"
        echo "=============================================="

        echo
        echo "Kernel image:"

        if [ -f "$OUT/arch/arm64/boot/Image" ]; then
          ls -lh "$OUT/arch/arm64/boot/Image"
        else
          echo "::error::Image was not generated."
          exit 1
        fi

        echo
        echo "Kernel release:"

        cd "$KERNEL_DIR"

        make \
          O="$OUT" \
          ARCH=arm64 \
          LLVM="$CLANG_PATH/" \
          LLVM_IAS=1 \
          kernelrelease

        echo
        echo "VMLINUX:"
        if [ -f "$OUT/vmlinux" ]; then
          ls -lh "$OUT/vmlinux"
        fi

    # ------------------------------------------------------------
    # 13. Package
    # ------------------------------------------------------------
    - name: Package kernel
      shell: bash
      run: |
        set -euo pipefail

        PKG="$GITHUB_WORKSPACE/package"

        rm -rf "$PKG"
        mkdir -p "$PKG"

        cp \
          "$OUT/arch/arm64/boot/Image" \
          "$PKG/Image"

        if [ -d "$OUT/arch/arm64/boot/dts" ]; then
          cp -a \
            "$OUT/arch/arm64/boot/dts" \
            "$PKG/dts"
        fi

        if [ -f "$OUT/System.map" ]; then
          cp "$OUT/System.map" "$PKG/"
        fi

        if [ -f "$OUT/.config" ]; then
          cp "$OUT/.config" "$PKG/kernel.config"
        fi

        if [ -f "$OUT/vmlinux" ]; then
          cp "$OUT/vmlinux" "$PKG/vmlinux"
        fi

        cd "$PKG"

        zip -r \
          "$GITHUB_WORKSPACE/A135F-4.19.198-MAX-ARAF.zip" \
          .

    # ------------------------------------------------------------
    # 14. Upload artifact
    # ------------------------------------------------------------
    - name: Upload kernel artifact
      uses: actions/upload-artifact@v4
      with:
        name: A135F-4.19.198-MAX-ARAF
        path: |
          A135F-4.19.198-MAX-ARAF.zip
          package/
        if-no-files-found: error
        compression-level: 0
