name: Build A135F Official Kernel 4.19.198

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  # Release details
  RELEASE_TAG: "v4.19.198"
  ASSET_NAME: "SM-A135F_14_Opensource.1.zip"
  ASSET_SHA256: "3d7390cb07238cf2e2dcd601459c56e58fd3cc0ad7eeedb3d9cf6932ba081e18"
  
  # Build details
  DEFCONFIG: "exynos850-a13xx_defconfig"
  LOCALVERSION: "-MAX-ARAF"
  ARCH: "arm64"
  SUBARCH: "arm64"

jobs:
  build-kernel:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev make libc6-dev \
            libncurses-dev crossbuild-essential-arm64 wget curl git \
            unzip zip python3 python-is-python3 libelf-dev \
            ca-certificates gnupg

      - name: Download Samsung OpenSource Package
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Downloading $ASSET_NAME from release $RELEASE_TAG..."
          gh release download "$RELEASE_TAG" -p "$ASSET_NAME" --repo "$GITHUB_REPOSITORY"
          
          echo "Verifying SHA256..."
          echo "$ASSET_SHA256  $ASSET_NAME" | sha256sum -c -
          
          echo "Testing ZIP integrity..."
          unzip -t "$ASSET_NAME" > /dev/null

      - name: Extract Outer Source ZIP
        run: |
          mkdir -p opensource_pkg
          unzip -q "$ASSET_NAME" -d opensource_pkg
          
          # Inspect Platform.tar.gz just in case vendor drivers are hiding there
          if [ -f "opensource_pkg/Platform.tar.gz" ]; then
            echo "Platform.tar.gz found. Logging its contents for reference."
            tar -tzf opensource_pkg/Platform.tar.gz > platform_files_list.txt || true
          fi

      - name: Extract Kernel Source
        run: |
          echo "Testing Kernel.tar.gz integrity..."
          gzip -t opensource_pkg/Kernel.tar.gz
          
          mkdir -p extracted_source
          echo "Extracting Kernel.tar.gz..."
          # Running tar without pipe to anything ensures accurate exit codes
          tar -xf opensource_pkg/Kernel.tar.gz -C extracted_source
          echo "Kernel extraction exit code: $?"

      - name: Safely Locate Kernel Root
        run: |
          export KERNEL_ROOT=""
          
          # Use mapfile to avoid find | head broken pipe issues
          mapfile -t MAKEFILE_LIST < <(find extracted_source -type f -name "Makefile" || true)
          
          for mf in "${MAKEFILE_LIST[@]}"; do
            DIR=$(dirname "$mf")
            if [[ -f "$DIR/arch/arm64/configs/$DEFCONFIG" ]] && [[ -f "$DIR/scripts/Makefile.build" ]]; then
              KERNEL_ROOT="$DIR"
              break
            fi
          done
          
          if [[ -z "$KERNEL_ROOT" ]]; then
            echo "::error::Could not find kernel root containing $DEFCONFIG and Makefile!"
            exit 1
          fi
          
          echo "Kernel root detected at: $KERNEL_ROOT"
          echo "KERNEL_ROOT=$KERNEL_ROOT" >> $GITHUB_ENV

      - name: Verify Kernel Source Version
        run: |
          cd "$KERNEL_ROOT"
          KVER=$(make kernelversion)
          echo "Base Kernel Version detected: $KVER"
          if [[ "$KVER" != "4.19.198" ]]; then
            echo "::warning::Expected base version 4.19.198, but got $KVER"
          fi

      - name: Setup Android Clang and GCC Toolchains
        run: |
          # Samsung's makefile explicitly expects Clang r383902 and GCC 4.9 in the toolchain directory.
          # We clone them directly into the expected paths so the makefile finds them natively.
          
          echo "Cloning Android Clang r383902..."
          mkdir -p "$KERNEL_ROOT/toolchain/clang/host/linux-x86"
          git clone --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-r383902 "$KERNEL_ROOT/toolchain/clang/host/linux-x86/clang-r383902"
          
          echo "Cloning AArch64 GCC 4.9 (for compatibility)..."
          mkdir -p "$KERNEL_ROOT/toolchain/gcc/linux-x86"
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 "$KERNEL_ROOT/toolchain/gcc/linux-x86/aarch64-linux-android-4.9"
          
          echo "Cloning ARM32 GCC 4.9 (for vDSO)..."
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 "$KERNEL_ROOT/toolchain/gcc/linux-x86/arm/arm-linux-androideabi-4.9"
          
          echo "Verifying Clang executable..."
          test -x "$KERNEL_ROOT/toolchain/clang/host/linux-x86/clang-r383902/bin/clang"
          "$KERNEL_ROOT/toolchain/clang/host/linux-x86/clang-r383902/bin/clang" --version

      - name: Inspect Source for Known Quirks
        run: |
          # The previous build failed on a missing Himax Makefile. Let's document it if it's missing.
          if [[ ! -d "$KERNEL_ROOT/drivers/input/touchscreen/himax" ]]; then
            echo "::warning::drivers/input/touchscreen/himax is missing from the kernel source tree!"
            echo "If the build fails, this vendor directory may need to be imported from Platform.tar.gz."
          fi

      - name: Apply Optional User Modifications
        run: |
          if [[ -f "patches/apply.sh" ]]; then
            echo "Found optional patch script. Executing..."
            bash patches/apply.sh "$KERNEL_ROOT" || echo "::warning::Patch script returned non-zero, continuing..."
          else
            echo "No patches/apply.sh found. Proceeding with baseline source."
          fi
          
          if [[ -f "kernel.config" ]]; then
            echo "Found custom kernel.config snippet. It will be merged later."
          fi

      - name: Configure Kernel
        run: |
          cd "$KERNEL_ROOT"
          
          # Add our exact downloaded toolchains to PATH
          export PATH="$PWD/toolchain/clang/host/linux-x86/clang-r383902/bin:$PWD/toolchain/gcc/linux-x86/aarch64-linux-android-4.9/bin:$PWD/toolchain/gcc/linux-x86/arm/arm-linux-androideabi-4.9/bin:$PATH"
          
          # Clean old config
          rm -f .config include/config/auto.conf
          
          # We use an in-tree build as it is safest for old, idiosyncratic Samsung makefiles
          echo "Running defconfig..."
          make $DEFCONFIG \
            ARCH=$ARCH \
            SUBARCH=$SUBARCH \
            CROSS_COMPILE="aarch64-linux-android-" \
            CROSS_COMPILE_ARM32="arm-linux-androideabi-" \
            CC="clang" \
            CLANG_TRIPLE="aarch64-linux-gnu-" \
            LLVM=1 \
            LLVM_IAS=1 \
            LOCALVERSION="$LOCALVERSION"
            
          # Verify the release version that the makefile generated
          KREL=$(make kernelrelease LOCALVERSION="$LOCALVERSION")
          echo "Configured Kernel Release: $KREL"

      - name: Build Kernel
        run: |
          cd "$KERNEL_ROOT"
          
          export PATH="$PWD/toolchain/clang/host/linux-x86/clang-r383902/bin:$PWD/toolchain/gcc/linux-x86/aarch64-linux-android-4.9/bin:$PWD/toolchain/gcc/linux-x86/arm/arm-linux-androideabi-4.9/bin:$PATH"
          
          echo "Starting kernel compilation..."
          # Using tee ensures logs are captured without suppressing real compiler errors (due to pipefail in GH Actions)
          make -j$(nproc) \
            ARCH=$ARCH \
            SUBARCH=$SUBARCH \
            CROSS_COMPILE="aarch64-linux-android-" \
            CROSS_COMPILE_ARM32="arm-linux-androideabi-" \
            CC="clang" \
            CLANG_TRIPLE="aarch64-linux-gnu-" \
            LLVM=1 \
            LLVM_IAS=1 \
            LOCALVERSION="$LOCALVERSION" 2>&1 | tee ../build.log

      - name: Generate Build Info and Package Artifacts
        if: success()
        run: |
          mkdir -p final-artifacts/A135F-4.19.198-MAX-ARAF
          cd "$KERNEL_ROOT"
          
          # Collect available targets safely
          [ -f arch/arm64/boot/Image ] && cp arch/arm64/boot/Image ../final-artifacts/A135F-4.19.198-MAX-ARAF/
          [ -f arch/arm64/boot/Image.gz ] && cp arch/arm64/boot/Image.gz ../final-artifacts/A135F-4.19.198-MAX-ARAF/
          [ -f arch/arm64/boot/Image.gz-dtb ] && cp arch/arm64/boot/Image.gz-dtb ../final-artifacts/A135F-4.19.198-MAX-ARAF/
          [ -f System.map ] && cp System.map ../final-artifacts/A135F-4.19.198-MAX-ARAF/
          [ -f vmlinux ] && cp vmlinux ../final-artifacts/A135F-4.19.198-MAX-ARAF/
          [ -f .config ] && cp .config ../final-artifacts/A135F-4.19.198-MAX-ARAF/
          
          make kernelrelease LOCALVERSION="$LOCALVERSION" > ../final-artifacts/A135F-4.19.198-MAX-ARAF/kernelrelease
          cp ../build.log ../final-artifacts/A135F-4.19.198-MAX-ARAF/ || true
          
          # Generate Build Info
          cat <<EOF > ../final-artifacts/A135F-4.19.198-MAX-ARAF/build-info.txt
          Device: SM-A135F
          SoC: Exynos 850
          Kernel base: $(make kernelversion)
          Localversion: $LOCALVERSION
          Defconfig: $DEFCONFIG
          Compiler: $(toolchain/clang/host/linux-x86/clang-r383902/bin/clang --version | head -n 1)
          Git commit: $GITHUB_SHA
          Build date: $(date -u)
          Runner: $(lsb_release -d -s)
          EOF
          
          cd ../final-artifacts
          zip -r9 A135F-4.19.198-MAX-ARAF-kernel.zip A135F-4.19.198-MAX-ARAF/

      - name: Upload Kernel Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A135F-4.19.198-MAX-ARAF-kernel
          path: final-artifacts/A135F-4.19.198-MAX-ARAF-kernel.zip

      - name: Collect Failure Diagnostics
        if: failure()
        run: |
          echo "Build failed. Collecting diagnostics..."
          mkdir -p failure-debug
          
          [ -f build.log ] && cp build.log failure-debug/
          [ -f platform_files_list.txt ] && cp platform_files_list.txt failure-debug/
          
          if [[ -n "$KERNEL_ROOT" ]]; then
            [ -f "$KERNEL_ROOT/.config" ] && cp "$KERNEL_ROOT/.config" failure-debug/
            [ -f "$KERNEL_ROOT/Makefile" ] && cp "$KERNEL_ROOT/Makefile" failure-debug/
            [ -f "$KERNEL_ROOT/scripts/Makefile.build" ] && cp "$KERNEL_ROOT/scripts/Makefile.build" failure-debug/
            
            # Inspect Touchscreen configs safely
            echo "--- HIMAX CONFIGS ---" > failure-debug/himax-diagnostics.txt
            grep -i HIMAX "$KERNEL_ROOT/.config" >> failure-debug/himax-diagnostics.txt || true
            echo "--- HIMAX DIRECTORY ---" >> failure-debug/himax-diagnostics.txt
            ls -laR "$KERNEL_ROOT/drivers/input/touchscreen/himax" >> failure-debug/himax-diagnostics.txt 2>/dev/null || echo "Directory does not exist" >> failure-debug/himax-diagnostics.txt
          fi
          
          env > failure-debug/environment.txt

      - name: Upload Failure Diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-debug
          path: failure-debug/
