nname: Build A135F Official Kernel 4.19.198

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # ============================================================
  # DEVICE
  # ============================================================
  DEVICE: "SM-A135F"
  SOC: "Exynos 850"

  # ============================================================
  # SAMSUNG OPEN SOURCE PACKAGE
  # ============================================================
  RELEASE_TAG: "v4.19.198"
  ASSET_NAME: "SM-A135F_14_Opensource.1.zip"

  # This is only a reference checksum.
  # IMPORTANT:
  # A checksum mismatch must NOT immediately kill the workflow.
  # The downloaded archive will be tested independently.
  EXPECTED_ASSET_SHA256: "3d7390cb07238cf2e2dcd601459c56e58fd3cc0ad7eeedb3d9cf6932ba081e18"

  # ============================================================
  # KERNEL
  # ============================================================
  EXPECTED_KERNEL_VERSION: "4.19.198"
  DEFCONFIG: "exynos850-a13xx_defconfig"
  ARCH: "arm64"
  SUBARCH: "arm64"
  LOCALVERSION: "-MAX-ARAF"

  # ============================================================
  # TOOLCHAIN
  # ============================================================
  CLANG_VERSION: "clang-r383902"
  CLANG_ARCHIVE_URL: "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-12.0.0_r10/clang-r383902.tar.gz"

  GCC_AARCH64_REPO: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9"
  GCC_ARM32_REPO: "https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9"

  GCC_BRANCH: "lineage-19.1"

  # ============================================================
  # BUILD
  # ============================================================
  BUILD_JOBS: "4"


jobs:

  build-kernel:

    name: Build A135F Kernel 4.19.198

    runs-on: ubuntu-22.04

    defaults:
      run:
        shell: bash

    steps:

      # ========================================================
      # 1. CHECKOUT
      # ========================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ========================================================
      # 2. HOST DEPENDENCIES
      # ========================================================
      - name: Install host dependencies
        run: |
          set -e

          echo "=============================================="
          echo " INSTALLING HOST DEPENDENCIES"
          echo "=============================================="

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            bc \
            bison \
            build-essential \
            cpio \
            curl \
            flex \
            gawk \
            git \
            gzip \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lz4 \
            make \
            openssl \
            python3 \
            python3-pip \
            rsync \
            tar \
            unzip \
            wget \
            xz-utils \
            zip \
            zstd

          echo
          echo "HOST READY"
          echo "----------------------------------------------"

          uname -a
          echo
          cat /etc/os-release
          echo
          make --version | head -n 1
          python3 --version
          git --version
          tar --version | head -n 1
          unzip -v | head -n 1

      # ========================================================
      # 3. PREPARE WORKSPACE
      # ========================================================
      - name: Prepare workspace
        run: |
          set -e

          rm -rf \
            "$RUNNER_TEMP/a135f-source" \
            "$RUNNER_TEMP/a135f-debug" \
            "$RUNNER_TEMP/a135f-tools"

          mkdir -p \
            "$RUNNER_TEMP/a135f-source" \
            "$RUNNER_TEMP/a135f-debug" \
            "$RUNNER_TEMP/a135f-tools"

          echo "Workspace prepared."

      # ========================================================
      # 4. RESOLVE SAMSUNG RELEASE ASSET
      # ========================================================
      - name: Resolve Samsung OpenSource release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e

          echo "=============================================="
          echo " RESOLVING SAMSUNG OPENSOURCE ASSET"
          echo "=============================================="

          echo "Repository : $GITHUB_REPOSITORY"
          echo "Release    : $RELEASE_TAG"
          echo "Asset      : $ASSET_NAME"

          mkdir -p "$RUNNER_TEMP/a135f-source/download"

          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY"

          echo
          echo "Available release assets:"
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name'

          echo
          echo "Downloading exact asset..."

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ASSET_NAME" \
            --dir "$RUNNER_TEMP/a135f-source/download" \
            --clobber

          if [[ ! -f "$RUNNER_TEMP/a135f-source/download/$ASSET_NAME" ]]; then
            echo "::error::Samsung OpenSource asset was not downloaded."
            exit 1
          fi

          echo "Asset downloaded successfully."

      # ========================================================
      # 5. VERIFY DOWNLOAD WITHOUT FALSE CHECKSUM FAILURE
      # ========================================================
      - name: Verify downloaded Samsung package
        run: |
          set -u

          cd "$RUNNER_TEMP/a135f-source/download"

          echo "=============================================="
          echo " VERIFYING SAMSUNG PACKAGE"
          echo "=============================================="

          ACTUAL_SHA256="$(sha256sum "$ASSET_NAME" | awk '{print $1}')"

          echo "Expected SHA256:"
          echo "$EXPECTED_ASSET_SHA256"

          echo
          echo "Actual SHA256:"
          echo "$ACTUAL_SHA256"

          echo "$ACTUAL_SHA256" > "$RUNNER_TEMP/a135f-source/download/actual.sha256"

          # ----------------------------------------------------
          # IMPORTANT:
          # Do NOT stop only because the reference checksum
          # differs. The previous workflow failed here.
          # ----------------------------------------------------
          if [[ "$ACTUAL_SHA256" == "$EXPECTED_ASSET_SHA256" ]]; then
            echo "SHA256 STATUS: MATCH"
          else
            echo "::warning::Reference SHA256 does not match the downloaded release asset."
            echo "Continuing because archive integrity will be checked separately."
          fi

          echo
          echo "Testing ZIP structure..."

          if unzip -t "$ASSET_NAME" > "$RUNNER_TEMP/a135f-source/download/zip-test.log" 2>&1; then
            echo "ZIP STATUS: VALID"
          else
            echo "::error::Downloaded file is not a valid ZIP archive."
            cat "$RUNNER_TEMP/a135f-source/download/zip-test.log"
            exit 1
          fi

          FILE_SIZE="$(stat -c '%s' "$ASSET_NAME")"

          echo
          echo "File size: $FILE_SIZE bytes"

          if [[ "$FILE_SIZE" -lt 1000000 ]]; then
            echo "::error::Downloaded package is suspiciously small."
            exit 1
          fi

          echo "Samsung package passed integrity checks."

      # ========================================================
      # 6. EXTRACT OUTER SAMSUNG PACKAGE
      # ========================================================
      - name: Extract Samsung OpenSource package
        run: |
          set -e

          cd "$RUNNER_TEMP/a135f-source"

          rm -rf outer-source
          mkdir -p outer-source

          echo "=============================================="
          echo " EXTRACTING OUTER PACKAGE"
          echo "=============================================="

          unzip -q \
            "download/$ASSET_NAME" \
            -d outer-source

          echo
          echo "Top-level extracted files:"

          find outer-source \
            -maxdepth 3 \
            -type f \
            -printf '%p\n' \
            > outer-file-list.txt

          sed -n '1,200p' outer-file-list.txt

          echo
          echo "Searching for Kernel.tar.gz..."

          KERNEL_TAR=""

          while IFS= read -r -d '' candidate; do
            KERNEL_TAR="$candidate"
            break
          done < <(
            find outer-source \
              -type f \
              \( \
                -name "Kernel.tar.gz" \
                -o \
                -name "kernel.tar.gz" \
                -o \
                -iname "*kernel*.tar.gz" \
              \) \
              -print0
          )

          if [[ -z "$KERNEL_TAR" ]]; then
            echo "::error::Could not locate Kernel.tar.gz inside Samsung package."

            echo
            echo "All archive contents:"
            find outer-source -type f -print

            exit 1
          fi

          echo "Kernel archive found:"
          echo "$KERNEL_TAR"

          echo "$KERNEL_TAR" > "$RUNNER_TEMP/a135f-source/kernel-tar-path.txt"

          echo
          echo "Testing Kernel.tar.gz..."

          gzip -t "$KERNEL_TAR"

          echo "Kernel.tar.gz integrity: OK"

      # ========================================================
      # 7. EXTRACT KERNEL SOURCE SAFELY
      # ========================================================
      - name: Extract kernel source
        run: |
          set -e

          cd "$RUNNER_TEMP/a135f-source"

          rm -rf kernel-source
          mkdir -p kernel-source

          KERNEL_TAR="$(cat kernel-tar-path.txt)"

          echo "=============================================="
          echo " EXTRACTING KERNEL SOURCE"
          echo "=============================================="

          echo "Archive:"
          echo "$KERNEL_TAR"

          echo
          echo "Archive size:"
          stat -c '%s bytes' "$KERNEL_TAR"

          echo
          echo "Listing archive before extraction..."

          tar -tzf "$KERNEL_TAR" \
            > kernel-tar-list.txt

          echo "Archive contains $(wc -l < kernel-tar-list.txt) entries."

          echo
          echo "Extracting..."

          tar \
            --extract \
            --gzip \
            --file="$KERNEL_TAR" \
            --directory=kernel-source \
            --no-same-owner \
            --no-same-permissions

          echo
          echo "Extraction command completed."

          echo
          echo "Searching for kernel Makefile..."

          MAKEFILE_COUNT=0

          while IFS= read -r -d '' mf; do
            MAKEFILE_COUNT=$((MAKEFILE_COUNT + 1))
            echo "Makefile candidate: $mf"
          done < <(
            find kernel-source \
              -type f \
              -name Makefile \
              -print0
          )

          echo
          echo "Makefile count: $MAKEFILE_COUNT"

          if [[ "$MAKEFILE_COUNT" -eq 0 ]]; then
            echo "::error::No Makefile found after extraction."
            exit 1
          fi

      # ========================================================
      # 8. AUTO-DETECT KERNEL ROOT
      # ========================================================
      - name: Locate Samsung kernel root
        run: |
          set -e

          cd "$RUNNER_TEMP/a135f-source"

          echo "=============================================="
          echo " LOCATING KERNEL ROOT"
          echo "=============================================="

          KERNEL_ROOT=""

          while IFS= read -r -d '' mf; do

            DIR="$(dirname "$mf")"

            if [[ \
              -f "$DIR/arch/arm64/configs/$DEFCONFIG" && \
              -f "$DIR/scripts/Makefile.build" && \
              -f "$DIR/Makefile"
            ]]; then

              echo
              echo "VALID KERNEL ROOT FOUND:"
              echo "$DIR"

              KERNEL_ROOT="$DIR"
              break
            fi

          done < <(
            find kernel-source \
              -type f \
              -name Makefile \
              -print0
          )

          if [[ -z "$KERNEL_ROOT" ]]; then
            echo "::error::Could not locate valid Samsung kernel root."

            echo
            echo "Searching for defconfig directly..."

            while IFS= read -r -d '' cfg; do
              echo "Defconfig candidate:"
              echo "$cfg"
            done < <(
              find kernel-source \
                -type f \
                -name "$DEFCONFIG" \
                -print0
            )

            echo
            echo "Top-level extracted structure:"
            find kernel-source \
              -maxdepth 3 \
              -type d \
              -print \
              | sed -n '1,250p'

            exit 1
          fi

          echo "KERNEL_ROOT=$KERNEL_ROOT" >> "$GITHUB_ENV"

          echo
          echo "KERNEL_ROOT=$KERNEL_ROOT"

      # ========================================================
      # 9. SOURCE VALIDATION
      # ========================================================
      - name: Validate Samsung 4.19.198 source
        run: |
          set -e

          cd "$KERNEL_ROOT"

          echo "=============================================="
          echo " SOURCE VALIDATION"
          echo "=============================================="

          echo "Kernel root:"
          pwd

          echo
          echo "Defconfig:"
          test -f "arch/arm64/configs/$DEFCONFIG"
          echo "FOUND"

          echo
          echo "Kernel Makefile version fields:"
          grep -E \
            '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' \
            Makefile || true

          echo
          echo "Running make kernelversion..."

          BASE_VERSION="$(make -s kernelversion 2>/dev/null || true)"

          echo "Detected kernel version: ${BASE_VERSION:-UNKNOWN}"

          if [[ "$BASE_VERSION" != "$EXPECTED_KERNEL_VERSION" ]]; then
            echo "::warning::Expected $EXPECTED_KERNEL_VERSION but detected ${BASE_VERSION:-UNKNOWN}."
          else
            echo "Kernel version: PASS"
          fi

          echo
          echo "Samsung toolchain references:"

          grep -nE \
            'clang-r[0-9]+|CROSS_COMPILE|CLANG_TRIPLE|CLANG_PATH' \
            Makefile \
            2>/dev/null \
            | sed -n '1,120p' \
            || true

          echo
          echo "Defconfig references:"

          grep -n "exynos850" \
            arch/arm64/configs/"$DEFCONFIG" \
            2>/dev/null \
            | sed -n '1,80p' \
            || true

      # ========================================================
      # 10. INSTALL OFFICIAL CLANG R383902
      # ========================================================
      - name: Install Android Clang r383902
        run: |
          set -e

          cd "$RUNNER_TEMP/a135f-source"

          echo "=============================================="
          echo " INSTALLING ANDROID CLANG R383902"
          echo "=============================================="

          CLANG_ROOT="$KERNEL_ROOT/toolchain/clang/host/linux-x86/$CLANG_VERSION"

          rm -rf "$CLANG_ROOT"

          mkdir -p "$CLANG_ROOT"

          echo "Downloading:"
          echo "$CLANG_ARCHIVE_URL"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            --connect-timeout 20 \
            --max-time 900 \
            "$CLANG_ARCHIVE_URL" \
            -o clang.tar.gz

          echo
          echo "Testing clang archive..."

          gzip -t clang.tar.gz

          echo
          echo "Extracting clang..."

          tar \
            --extract \
            --gzip \
            --file=clang.tar.gz \
            --directory="$CLANG_ROOT" \
            --no-same-owner \
            --no-same-permissions

          echo
          echo "Checking clang..."

          test -x "$CLANG_ROOT/bin/clang"

          "$CLANG_ROOT/bin/clang" --version

          echo
          echo "Clang installation complete."

      # ========================================================
      # 11. INSTALL GCC 4.9
      # ========================================================
      - name: Install GCC 4.9 compatibility toolchains
        run: |
          set -e

          echo "=============================================="
          echo " INSTALLING GCC 4.9 TOOLCHAINS"
          echo "=============================================="

          GCC64="$KERNEL_ROOT/toolchain/gcc/linux-x86/aarch64-linux-android-4.9"
          GCC32="$KERNEL_ROOT/toolchain/gcc/linux-x86/arm/arm-linux-androideabi-4.9"

          rm -rf "$GCC64" "$GCC32"

          mkdir -p \
            "$KERNEL_ROOT/toolchain/gcc/linux-x86"

          echo
          echo "AArch64 GCC 4.9..."

          git clone \
            --depth=1 \
            --branch "$GCC_BRANCH" \
            "$GCC_AARCH64_REPO" \
            "$GCC64"

          echo
          echo "ARM32 GCC 4.9..."

          git clone \
            --depth=1 \
            --branch "$GCC_BRANCH" \
            "$GCC_ARM32_REPO" \
            "$GCC32"

          echo
          echo "Checking GCC binaries..."

          test -x "$GCC64/bin/aarch64-linux-android-gcc"
          test -x "$GCC32/bin/arm-linux-androideabi-gcc"

          "$GCC64/bin/aarch64-linux-android-gcc" --version | head -n 1
          "$GCC32/bin/arm-linux-androideabi-gcc" --version | head -n 1

          echo
          echo "GCC toolchains ready."

      # ========================================================
      # 12. CREATE TOOLCHAIN ENVIRONMENT
      # ========================================================
      - name: Prepare Samsung toolchain environment
        run: |
          set -e

          CLANG_DIR="$KERNEL_ROOT/toolchain/clang/host/linux-x86/$CLANG_VERSION"

          GCC64_DIR="$KERNEL_ROOT/toolchain/gcc/linux-x86/aarch64-linux-android-4.9"
          GCC32_DIR="$KERNEL_ROOT/toolchain/gcc/linux-x86/arm/arm-linux-androideabi-4.9"

          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_ENV"
          echo "GCC64_DIR=$GCC64_DIR" >> "$GITHUB_ENV"
          echo "GCC32_DIR=$GCC32_DIR" >> "$GITHUB_ENV"

          echo "$CLANG_DIR/bin" >> "$GITHUB_PATH"
          echo "$GCC64_DIR/bin" >> "$GITHUB_PATH"
          echo "$GCC32_DIR/bin" >> "$GITHUB_PATH"

          echo
          echo "Toolchain paths:"
          echo "CLANG_DIR=$CLANG_DIR"
          echo "GCC64_DIR=$GCC64_DIR"
          echo "GCC32_DIR=$GCC32_DIR"

          echo
          echo "clang:"
          "$CLANG_DIR/bin/clang" --version | head -n 2

          echo
          echo "aarch64 gcc:"
          "$GCC64_DIR/bin/aarch64-linux-android-gcc" --version | head -n 1

      # ========================================================
      # 13. OPTIONAL PATCHES
      # ========================================================
      - name: Apply optional kernel modifications
        run: |
          set -u

          cd "$GITHUB_WORKSPACE"

          if [[ -f "patches/apply.sh" ]]; then
            echo "Optional patch script found."
            echo "Running..."

            if bash "patches/apply.sh" "$KERNEL_ROOT"; then
              echo "Patch script completed successfully."
            else
              echo "::error::patches/apply.sh failed."
              exit 1
            fi
          else
            echo "No optional patches found."
          fi

      # ========================================================
      # 14. CONFIGURE KERNEL
      # ========================================================
      - name: Configure kernel
        run: |
          set -e

          cd "$KERNEL_ROOT"

          echo "=============================================="
          echo " CONFIGURING KERNEL"
          echo "=============================================="

          export ARCH="$ARCH"
          export SUBARCH="$SUBARCH"

          export PATH="$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"

          # ----------------------------------------------------
          # Samsung-compatible variables
          # ----------------------------------------------------
          export CROSS_COMPILE="$GCC64_DIR/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GCC32_DIR/bin/arm-linux-androideabi-"

          export CLANG_TRIPLE="aarch64-linux-gnu-"

          export CC="$CLANG_DIR/bin/clang"

          export LLVM=1
          export LLVM_IAS=1

          export LOCALVERSION="$LOCALVERSION"

          # Android kernel variables used by old Samsung trees
          export PLATFORM_VERSION=14
          export ANDROID_MAJOR_VERSION=u

          echo "ARCH=$ARCH"
          echo "SUBARCH=$SUBARCH"
          echo "CC=$CC"
          echo "CROSS_COMPILE=$CROSS_COMPILE"
          echo "CROSS_COMPILE_ARM32=$CROSS_COMPILE_ARM32"
          echo "CLANG_TRIPLE=$CLANG_TRIPLE"
          echo "LLVM=$LLVM"
          echo "LLVM_IAS=$LLVM_IAS"
          echo "LOCALVERSION=$LOCALVERSION"

          echo
          echo "Cleaning old configuration..."

          rm -f .config
          rm -f include/config/auto.conf
          rm -f include/generated/autoconf.h

          echo
          echo "Running defconfig..."

          make \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            LLVM=1 \
            LLVM_IAS=1 \
            LOCALVERSION="$LOCALVERSION" \
            "$DEFCONFIG"

          echo
          echo "Defconfig completed."

          test -f .config

          echo
          echo "Running olddefconfig..."

          make \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            LLVM=1 \
            LLVM_IAS=1 \
            LOCALVERSION="$LOCALVERSION" \
            olddefconfig

          echo
          echo "Final kernel release:"

          make \
            -s \
            ARCH="$ARCH" \
            LOCALVERSION="$LOCALVERSION" \
            kernelrelease

      # ========================================================
      # 15. BUILD KERNEL
      # ========================================================
      - name: Build kernel
        run: |
          set -uo pipefail

          cd "$KERNEL_ROOT"

          mkdir -p "$RUNNER_TEMP/a135f-debug"

          BUILD_LOG="$RUNNER_TEMP/a135f-debug/build.log"

          echo "=============================================="
          echo " BUILDING SAMSUNG A135F KERNEL"
          echo "=============================================="

          export ARCH="$ARCH"
          export SUBARCH="$SUBARCH"

          export PATH="$CLANG_DIR/bin:$GCC64_DIR/bin:$GCC32_DIR/bin:$PATH"

          export CROSS_COMPILE="$GCC64_DIR/bin/aarch64-linux-android-"
          export CROSS_COMPILE_ARM32="$GCC32_DIR/bin/arm-linux-androideabi-"

          export CLANG_TRIPLE="aarch64-linux-gnu-"
          export CC="$CLANG_DIR/bin/clang"

          export LLVM=1
          export LLVM_IAS=1
          export LOCALVERSION="$LOCALVERSION"

          export PLATFORM_VERSION=14
          export ANDROID_MAJOR_VERSION=u

          echo
          echo "Compiler:"
          "$CC" --version | head -n 2

          echo
          echo "Kernel version:"
          make -s kernelversion

          echo
          echo "Kernel release:"
          make -s kernelrelease LOCALVERSION="$LOCALVERSION"

          echo
          echo "Starting compilation..."
          echo "Jobs: $BUILD_JOBS"

          set +e

          make \
            -j"$BUILD_JOBS" \
            ARCH="$ARCH" \
            SUBARCH="$SUBARCH" \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CROSS_COMPILE_ARM32="$CROSS_COMPILE_ARM32" \
            CC="$CC" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            LLVM=1 \
            LLVM_IAS=1 \
            LOCALVERSION="$LOCALVERSION" \
            2>&1 | tee "$BUILD_LOG"

          BUILD_RC="${PIPESTATUS[0]}"

          set -e

          echo
          echo "=============================================="
          echo " BUILD EXIT CODE: $BUILD_RC"
          echo "=============================================="

          if [[ "$BUILD_RC" -ne 0 ]]; then
            echo "::error::Kernel compilation failed."

            echo
            echo "Last 150 lines of build log:"
            tail -n 150 "$BUILD_LOG" || true

            exit "$BUILD_RC"
          fi

          echo
          echo "KERNEL BUILD SUCCESSFUL."

      # ========================================================
      # 16. VERIFY OUTPUT
      # ========================================================
      - name: Verify kernel output
        if: success()
        run: |
          set -e

          cd "$KERNEL_ROOT"

          echo "=============================================="
          echo " VERIFYING BUILD OUTPUT"
          echo "=============================================="

          echo
          echo "Kernel release:"
          make -s kernelrelease LOCALVERSION="$LOCALVERSION"

          echo
          echo "Searching boot images..."

          find arch/arm64/boot \
            -maxdepth 2 \
            -type f \
            -printf '%p %s bytes\n' \
            | sort

          if [[ ! -f "arch/arm64/boot/Image" ]]; then
            echo "::error::arch/arm64/boot/Image was not generated."
            exit 1
          fi

          echo
          echo "Image found."

          echo
          echo "Checking vmlinux..."

          if [[ -f "vmlinux" ]]; then
            file vmlinux || true
          fi

          echo
          echo "Checking System.map..."

          if [[ -f "System.map" ]]; then
            wc -c System.map
          fi

          echo
          echo "Build output validation passed."

      # ========================================================
      # 17. PACKAGE ARTIFACTS
      # ========================================================
      - name: Package kernel artifacts
        if: success()
        run: |
          set -e

          OUT="$GITHUB_WORKSPACE/final-artifacts/A135F-4.19.198-MAX-ARAF"

          rm -rf "$GITHUB_WORKSPACE/final-artifacts"

          mkdir -p "$OUT"

          cd "$KERNEL_ROOT"

          echo "=============================================="
          echo " PACKAGING KERNEL"
          echo "=============================================="

          # Main kernel image
          cp arch/arm64/boot/Image "$OUT/Image"

          # Optional compressed outputs
          [[ -f arch/arm64/boot/Image.gz ]] \
            && cp arch/arm64/boot/Image.gz "$OUT/Image.gz"

          [[ -f arch/arm64/boot/Image.gz-dtb ]] \
            && cp arch/arm64/boot/Image.gz-dtb "$OUT/Image.gz-dtb"

          [[ -f arch/arm64/boot/Image.lz4 ]] \
            && cp arch/arm64/boot/Image.lz4 "$OUT/Image.lz4"

          [[ -f arch/arm64/boot/Image.lz4-dtb ]] \
            && cp arch/arm64/boot/Image.lz4-dtb "$OUT/Image.lz4-dtb"

          # Kernel metadata
          [[ -f System.map ]] \
            && cp System.map "$OUT/System.map"

          [[ -f vmlinux ]] \
            && cp vmlinux "$OUT/vmlinux"

          [[ -f .config ]] \
            && cp .config "$OUT/.config"

          # DTS files if present
          if [[ -d arch/arm64/boot/dts ]]; then
            mkdir -p "$OUT/dts"
            cp -r arch/arm64/boot/dts/* "$OUT/dts/" || true
          fi

          # Build log
          if [[ -f "$RUNNER_TEMP/a135f-debug/build.log" ]]; then
            cp "$RUNNER_TEMP/a135f-debug/build.log" "$OUT/build.log"
          fi

          KERNEL_RELEASE="$(make -s kernelrelease LOCALVERSION="$LOCALVERSION")"

          cat > "$OUT/build-info.txt" <<EOF
Device: $DEVICE
SoC: $SOC
Kernel base: $EXPECTED_KERNEL_VERSION
Kernel release: $KERNEL_RELEASE
Defconfig: $DEFCONFIG
Architecture: $ARCH
Localversion: $LOCALVERSION
Compiler: $CLANG_VERSION
Compiler version:
$("$CLANG_DIR/bin/clang" --version | head -n 1)
Git commit: $GITHUB_SHA
Build date UTC: $(date -u)
Runner: $(uname -a)
EOF

          echo
          echo "Artifact contents:"
          find "$OUT" \
            -maxdepth 2 \
            -type f \
            -printf '%p %s bytes\n' \
            | sort

          cd "$GITHUB_WORKSPACE/final-artifacts"

          zip \
            -r9 \
            "A135F-4.19.198-MAX-ARAF-kernel.zip" \
            "A135F-4.19.198-MAX-ARAF"

          sha256sum \
            "A135F-4.19.198-MAX-ARAF-kernel.zip" \
            > "A135F-4.19.198-MAX-ARAF-kernel.zip.sha256"

      # ========================================================
      # 18. UPLOAD SUCCESS ARTIFACT
      # ========================================================
      - name: Upload successful kernel artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: A135F-4.19.198-MAX-ARAF-kernel
          path: |
            final-artifacts/A135F-4.19.198-MAX-ARAF-kernel.zip
            final-artifacts/A135F-4.19.198-MAX-ARAF-kernel.zip.sha256
          if-no-files-found: error
          retention-days: 14

      # ========================================================
      # 19. FAILURE DIAGNOSTICS
      # ========================================================
      - name: Collect failure diagnostics
        if: failure()
        run: |
          set +e

          DEBUG="$RUNNER_TEMP/a135f-debug"

          mkdir -p "$DEBUG"

          echo "=============================================="
          echo " FAILURE DIAGNOSTICS"
          echo "=============================================="

          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $GITHUB_SHA"
            echo "Run: $GITHUB_RUN_ID"
            echo "Device: $DEVICE"
            echo "SoC: $SOC"
            echo "Expected kernel: $EXPECTED_KERNEL_VERSION"
            echo "Defconfig: $DEFCONFIG"
            echo "Localversion: $LOCALVERSION"
            echo "Clang: $CLANG_VERSION"
            echo "Runner: $(uname -a)"
            echo "Date: $(date -u)"
          } > "$DEBUG/build-environment.txt"

          echo
          echo "Saving source information..."

          if [[ -n "${KERNEL_ROOT:-}" && -d "${KERNEL_ROOT:-}" ]]; then

            {
              echo "KERNEL_ROOT=$KERNEL_ROOT"
              echo
              echo "Makefile version:"
              grep -E \
                '^(VERSION|PATCHLEVEL|SUBLEVEL|EXTRAVERSION)[[:space:]]*=' \
                "$KERNEL_ROOT/Makefile" \
                2>/dev/null

              echo
              echo "Kernel version:"
              make \
                -s \
                -C "$KERNEL_ROOT" \
                kernelversion \
                2>&1

              echo
              echo "Kernel release:"
              make \
                -s \
                -C "$KERNEL_ROOT" \
                kernelrelease \
                LOCALVERSION="$LOCALVERSION" \
                2>&1

            } > "$DEBUG/kernel-version.txt" 2>&1

            cp \
              "$KERNEL_ROOT/Makefile" \
              "$DEBUG/Makefile" \
              2>/dev/null || true

            cp \
              "$KERNEL_ROOT/.config" \
              "$DEBUG/config" \
              2>/dev/null || true

            if [[ -f "$KERNEL_ROOT/.config" ]]; then
              grep -i \
                -E 'HIMAX|TOUCH|EXYNOS|S5E|CONFIG_MODULES|CONFIG_MODVERSIONS' \
                "$KERNEL_ROOT/.config" \
                > "$DEBUG/config-relevant.txt" \
                2>/dev/null || true
            fi

            {
              echo "===== TOOLCHAIN REFERENCES ====="
              grep -nE \
                'clang-r[0-9]+|CROSS_COMPILE|CLANG_TRIPLE|CLANG_PATH' \
                "$KERNEL_ROOT/Makefile" \
                2>/dev/null || true

              echo
              echo "===== TOOLCHAIN FILES ====="

              find "$KERNEL_ROOT/toolchain" \
                -maxdepth 7 \
                -type f \
                -name 'clang' \
                -o \
                -name 'aarch64-linux-android-gcc' \
                -o \
                -name 'arm-linux-androideabi-gcc' \
                2>/dev/null \
                | sort

            } > "$DEBUG/toolchain-diagnostics.txt"

          fi

          echo
          echo "Collecting recent build log..."

          if [[ -f "$DEBUG/build.log" ]]; then
            tail -n 300 "$DEBUG/build.log" \
              > "$DEBUG/build-last-300-lines.txt" \
              2>/dev/null || true
          fi

          echo
          echo "Collecting workspace information..."

          {
            echo "===== WORKSPACE ====="
            df -h

            echo
            echo "===== MEMORY ====="
            free -h

            echo
            echo "===== CPU ====="
            nproc

            echo
            echo "===== SOURCE SIZE ====="
            du -sh "$RUNNER_TEMP/a135f-source" \
              2>/dev/null || true

          } > "$DEBUG/host-diagnostics.txt" 2>&1

          echo
          echo "Diagnostics ready."

      # ========================================================
      # 20. UPLOAD FAILURE DEBUG
      # ========================================================
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: A135F-4.19.198-build-failure-debug
          path: |
            ${{ runner.temp }}/a135f-debug/
            ${{ runner.temp }}/a135f-source/download/actual.sha256
            ${{ runner.temp }}/a135f-source/download/zip-test.log
            ${{ runner.temp }}/a135f-source/kernel-tar-path.txt
            ${{ runner.temp }}/a135f-source/kernel-tar-list.txt
          if-no-files-found: warn
          retention-days: 14
