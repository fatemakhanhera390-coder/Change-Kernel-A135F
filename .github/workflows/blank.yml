name: A135F 4.19.198 Kernel Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Samsung OpenSource release tag"
        required: true
        default: "v4.19.198"

      source_asset:
        description: "Release source ZIP asset"
        required: true
        default: "SM-A135F_14_Opensource.1.zip"

      build_jobs:
        description: "Parallel build jobs"
        required: true
        default: "2"

permissions:
  contents: read

env:
  EXPECTED_KERNEL: "4.19.198"
  EXPECTED_DEFCONFIG: "exynos850-a13xx_defconfig"
  LOCALVERSION: "-MAX-ARAF"
  CLANG_RELEASE: "clang-r383902"

jobs:
  build-kernel:
    name: Build A135F Kernel 4.19.198
    runs-on: ubuntu-22.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================
      - name: Checkout workflow repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ============================================================
      # 2. INSTALL DEPENDENCIES
      # ============================================================
      - name: Install build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            cpio \
            curl \
            device-tree-compiler \
            flex \
            gcc-aarch64-linux-gnu \
            git \
            libdw-dev \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lz4 \
            make \
            python3 \
            rsync \
            tar \
            unzip \
            wget \
            xz-utils \
            zip \
            zstd

          echo "Dependencies installed successfully."

      # ============================================================
      # 3. DOWNLOAD RELEASE ASSET
      # ============================================================
      - name: Download Samsung OpenSource package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/download"

          cd "$GITHUB_WORKSPACE/download"

          echo "=============================================="
          echo "DOWNLOAD SOURCE"
          echo "=============================================="

          echo "Release tag : ${{ inputs.release_tag }}"
          echo "Asset        : ${{ inputs.source_asset }}"

          gh release download \
            "${{ inputs.release_tag }}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "${{ inputs.source_asset }}" \
            --clobber

          test -f "${{ inputs.source_asset }}"

          echo
          echo "Downloaded source:"
          ls -lh "${{ inputs.source_asset }}"

          echo
          echo "SHA256:"
          sha256sum "${{ inputs.source_asset }}"

      # ============================================================
      # 4. VERIFY OUTER ZIP
      # ============================================================
      - name: Validate source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/download/${{ inputs.source_asset }}"

          echo "Testing ZIP integrity..."

          unzip -t "$ZIP_FILE"

          echo
          echo "ZIP integrity: PASS"

          echo
          echo "ZIP contents:"
          unzip -l "$ZIP_FILE" | head -100

      # ============================================================
      # 5. EXTRACT OUTER ZIP
      # ============================================================
      - name: Extract OpenSource package
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/download/${{ inputs.source_asset }}"
          OUTER_DIR="$GITHUB_WORKSPACE/outer-source"

          rm -rf "$OUTER_DIR"
          mkdir -p "$OUTER_DIR"

          echo "Extracting Samsung OpenSource ZIP..."

          unzip -q "$ZIP_FILE" -d "$OUTER_DIR"

          echo
          echo "Outer package extracted."

          echo
          echo "Archives found:"
          find "$OUTER_DIR" \
            -type f \
            \( -name "*.tar.gz" -o -name "*.tar" -o -name "*.zip" \) \
            -printf "%p\n" \
            | sort

      # ============================================================
      # 6. FIND KERNEL TAR
      # ============================================================
      - name: Locate Kernel.tar.gz
        id: kernel_tar
        shell: bash
        run: |
          set -euo pipefail

          OUTER_DIR="$GITHUB_WORKSPACE/outer-source"

          echo "Searching for Kernel.tar.gz..."

          KERNEL_ARCHIVE="$(
            find "$OUTER_DIR" \
              -type f \
              \( -name "Kernel.tar.gz" -o -name "Kernel.tar" \) \
              -print \
              | head -n 1
          )"

          if [ -z "$KERNEL_ARCHIVE" ]; then
            echo "::error::Kernel.tar.gz was not found."

            echo
            echo "Complete extracted file list:"
            find "$OUTER_DIR" -type f -print | sort | head -500

            exit 1
          fi

          echo
          echo "Kernel archive:"
          echo "$KERNEL_ARCHIVE"

          echo "kernel_archive=$KERNEL_ARCHIVE" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 7. VALIDATE Kernel.tar.gz
      # ============================================================
      - name: Validate Kernel archive
        env:
          KERNEL_ARCHIVE: ${{ steps.kernel_tar.outputs.kernel_archive }}
        shell: bash
        run: |
          set -euo pipefail

          echo "=============================================="
          echo "VALIDATING KERNEL ARCHIVE"
          echo "=============================================="

          echo
          echo "File:"
          ls -lh "$KERNEL_ARCHIVE"

          echo
          echo "Testing gzip..."

          gzip -t "$KERNEL_ARCHIVE"

          echo "gzip: PASS"

          echo
          echo "Testing TAR listing..."

          tar -tzf "$KERNEL_ARCHIVE" > "$GITHUB_WORKSPACE/kernel-tar-list.txt"

          echo "TAR listing: PASS"

          echo
          echo "Archive entries:"
          head -80 "$GITHUB_WORKSPACE/kernel-tar-list.txt"

      # ============================================================
      # 8. SMART KERNEL EXTRACTION
      # ============================================================
      - name: Extract kernel source
        id: extract_kernel
        env:
          KERNEL_ARCHIVE: ${{ steps.kernel_tar.outputs.kernel_archive }}
        shell: bash
        run: |
          set -uo pipefail

          KERNEL_DIR="$GITHUB_WORKSPACE/kernel-source"

          rm -rf "$KERNEL_DIR"
          mkdir -p "$KERNEL_DIR"

          echo "=============================================="
          echo "EXTRACTING KERNEL SOURCE"
          echo "=============================================="

          echo
          echo "Archive:"
          echo "$KERNEL_ARCHIVE"

          echo
          echo "Starting extraction..."

          # Do not immediately fail on tar's exit code.
          # Some Samsung archives contain metadata/ownership entries
          # that can make GNU tar return code 2 even after extracting
          # the complete source tree.

          set +e

          tar \
            -xzf "$KERNEL_ARCHIVE" \
            -C "$KERNEL_DIR" \
            --no-same-owner \
            --no-same-permissions \
            --warning=no-unknown-keyword

          TAR_RC=$?

          set -e

          echo
          echo "tar exit code: $TAR_RC"

          echo
          echo "Checking extracted source..."

          MAKEFILE_FOUND="false"
          DEFCONFIG_FOUND="false"

          if find "$KERNEL_DIR" \
               -type f \
               -name "Makefile" \
               -print \
               | grep -q .; then
            MAKEFILE_FOUND="true"
          fi

          if find "$KERNEL_DIR" \
               -type f \
               -path "*/arch/arm64/configs/$EXPECTED_DEFCONFIG" \
               -print \
               | grep -q .; then
            DEFCONFIG_FOUND="true"
          fi

          echo
          echo "Makefile found  : $MAKEFILE_FOUND"
          echo "Defconfig found : $DEFCONFIG_FOUND"

          # --------------------------------------------------------
          # If tar reported an error but the complete kernel root
          # is present, continue.
          # --------------------------------------------------------

          if [ "$MAKEFILE_FOUND" = "true" ] &&
             [ "$DEFCONFIG_FOUND" = "true" ]; then

            echo
            echo "Kernel source appears complete."

            if [ "$TAR_RC" -ne 0 ]; then
              echo "::warning::tar returned $TAR_RC, but required kernel files are present. Continuing."
            fi

          else
            echo
            echo "::error::Kernel source extraction is incomplete."

            echo
            echo "Extracted top-level:"
            find "$KERNEL_DIR" -maxdepth 2 -print | head -300

            exit 1
          fi

          echo
          echo "Kernel extraction: PASS"

      # ============================================================
      # 9. AUTO-DETECT REAL KERNEL ROOT
      # ============================================================
      - name: Detect kernel root
        id: detect_root
        shell: bash
        run: |
          set -euo pipefail

          SEARCH_ROOT="$GITHUB_WORKSPACE/kernel-source"

          echo "=============================================="
          echo "SEARCHING FOR KERNEL ROOT"
          echo "=============================================="

          SELECTED=""

          while IFS= read -r -d '' MF; do

            ROOT="$(dirname "$MF")"

            [ -d "$ROOT/arch/arm64" ] || continue
            [ -d "$ROOT/arch/arm64/configs" ] || continue

            if ! grep -qE '^[[:space:]]*VERSION[[:space:]]*=' "$MF"; then
              continue
            fi

            if ! grep -qE '^[[:space:]]*PATCHLEVEL[[:space:]]*=' "$MF"; then
              continue
            fi

            if ! grep -qE '^[[:space:]]*SUBLEVEL[[:space:]]*=' "$MF"; then
              continue
            fi

            if [ -f "$ROOT/arch/arm64/configs/$EXPECTED_DEFCONFIG" ]; then
              SELECTED="$ROOT"
              break
            fi

            if [ -z "$SELECTED" ]; then
              SELECTED="$ROOT"
            fi

          done < <(
            find "$SEARCH_ROOT" \
              -type f \
              -name "Makefile" \
              -print0
          )

          if [ -z "$SELECTED" ]; then
            echo "::error::No Linux kernel root detected."
            exit 1
          fi

          echo
          echo "SELECTED KERNEL ROOT:"
          echo "$SELECTED"

          echo
          echo "Kernel root contents:"
          ls -la "$SELECTED" | head -80

          echo "kernel_dir=$SELECTED" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 10. VERIFY KERNEL VERSION
      # ============================================================
      - name: Verify Linux 4.19.198
        env:
          KERNEL_DIR: ${{ steps.detect_root.outputs.kernel_dir }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$KERNEL_DIR"

          echo "=============================================="
          echo "KERNEL VERSION CHECK"
          echo "=============================================="

          VERSION="$(awk '$1=="VERSION" {print $3; exit}' Makefile)"
          PATCHLEVEL="$(awk '$1=="PATCHLEVEL" {print $3; exit}' Makefile)"
          SUBLEVEL="$(awk '$1=="SUBLEVEL" {print $3; exit}' Makefile)"

          EXTRAVERSION="$(
            awk '$1=="EXTRAVERSION" {print $3; exit}' Makefile \
            || true
          )"

          EXTRAVERSION="${EXTRAVERSION:-}"

          DETECTED="${VERSION}.${PATCHLEVEL}.${SUBLEVEL}${EXTRAVERSION}"

          echo "VERSION      : $VERSION"
          echo "PATCHLEVEL   : $PATCHLEVEL"
          echo "SUBLEVEL     : $SUBLEVEL"
          echo "EXTRAVERSION : $EXTRAVERSION"
          echo
          echo "Detected     : $DETECTED"
          echo "Expected     : $EXPECTED_KERNEL"

          if [ "$DETECTED" != "$EXPECTED_KERNEL" ]; then
            echo "::error::Kernel version mismatch."
            exit 1
          fi

          echo
          echo "Kernel version: PASS"

      # ============================================================
      # 11. VERIFY DEFCONFIG
      # ============================================================
      - name: Verify A135F defconfig
        env:
          KERNEL_DIR: ${{ steps.detect_root.outputs.kernel_dir }}
        shell: bash
        run: |
          set -euo pipefail

          CONFIG="$KERNEL_DIR/arch/arm64/configs/$EXPECTED_DEFCONFIG"

          echo "=============================================="
          echo "DEFCONFIG CHECK"
          echo "=============================================="

          echo "Expected:"
          echo "$CONFIG"

          test -f "$CONFIG"

          echo
          echo "Defconfig: PASS"

      # ============================================================
      # 12. DOWNLOAD CLANG R383902
      # ============================================================
      - name: Download Android Clang r383902
        id: clang
        shell: bash
        run: |
          set -euo pipefail

          TOOLCHAIN_ROOT="$GITHUB_WORKSPACE/toolchains"
          CLANG_DIR="$TOOLCHAIN_ROOT/clang-r383902"

          mkdir -p "$TOOLCHAIN_ROOT"

          echo "=============================================="
          echo "ANDROID CLANG R383902"
          echo "=============================================="

          if [ ! -x "$CLANG_DIR/bin/clang" ]; then

            TMP="$TOOLCHAIN_ROOT/clang-r383902.tar.gz"

            echo "Downloading clang-r383902..."

            curl \
              --fail \
              --location \
              --retry 5 \
              --retry-delay 3 \
              -o "$TMP" \
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r383902.tar.gz"

            mkdir -p "$CLANG_DIR"

            tar \
              -xzf "$TMP" \
              -C "$CLANG_DIR" \
              --no-same-owner \
              --no-same-permissions

            rm -f "$TMP"
          fi

          if [ ! -x "$CLANG_DIR/bin/clang" ]; then
            echo "::error::clang-r383902 was not installed."
            exit 1
          fi

          echo
          echo "Compiler:"
          "$CLANG_DIR/bin/clang" --version | head -5

          echo
          echo "Clang path:"
          echo "$CLANG_DIR/bin/clang"

          echo "clang_dir=$CLANG_DIR" >> "$GITHUB_OUTPUT"

      # ============================================================
      # 13. CREATE SAMSUNG EXPECTED TOOLCHAIN PATH
      # ============================================================
      - name: Prepare Samsung toolchain paths
        env:
          KERNEL_DIR: ${{ steps.detect_root.outputs.kernel_dir }}
          CLANG_DIR: ${{ steps.clang.outputs.clang_dir }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$KERNEL_DIR"

          echo "=============================================="
          echo "SAMSUNG TOOLCHAIN COMPATIBILITY"
          echo "=============================================="

          # Samsung Makefile expects:
          #
          # toolchain/clang/host/linux-x86/clang-r383902/bin/clang
          #

          SAMSUNG_CLANG="$KERNEL_DIR/toolchain/clang/host/linux-x86/clang-r383902"

          rm -rf "$SAMSUNG_CLANG"

          mkdir -p "$(dirname "$SAMSUNG_CLANG")"

          ln -s "$CLANG_DIR" "$SAMSUNG_CLANG"

          test -x "$SAMSUNG_CLANG/bin/clang"

          echo
          echo "Samsung clang path:"
          echo "$SAMSUNG_CLANG/bin/clang"

          echo
          echo "Compiler:"
          "$SAMSUNG_CLANG/bin/clang" --version | head -3

          echo
          echo "Symlink:"
          readlink -f "$SAMSUNG_CLANG"

          echo
          echo "Toolchain compatibility: PASS"

      # ============================================================
      # 14. CONFIGURE KERNEL
      # ============================================================
      - name: Configure kernel
        env:
          KERNEL_DIR: ${{ steps.detect_root.outputs.kernel_dir }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$KERNEL_DIR"

          CLANG_DIR="$KERNEL_DIR/toolchain/clang/host/linux-x86/clang-r383902"

          export PATH="$CLANG_DIR/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          export PLATFORM_VERSION=14
          export ANDROID_MAJOR_VERSION=u

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          export CC="$CLANG_DIR/bin/clang"
          export LD="$CLANG_DIR/bin/ld.lld"
          export AR="$CLANG_DIR/bin/llvm-ar"
          export NM="$CLANG_DIR/bin/llvm-nm"
          export OBJCOPY="$CLANG_DIR/bin/llvm-objcopy"
          export OBJDUMP="$CLANG_DIR/bin/llvm-objdump"
          export STRIP="$CLANG_DIR/bin/llvm-strip"
          export READELF="$CLANG_DIR/bin/llvm-readelf"

          echo "=============================================="
          echo "KERNEL CONFIGURATION"
          echo "=============================================="

          echo
          echo "Kernel root:"
          pwd

          echo
          echo "Defconfig:"
          echo "$EXPECTED_DEFCONFIG"

          echo
          echo "Compiler:"
          "$CC" --version | head -2

          # Fresh Samsung source.
          # Do NOT use make mrproper.

          rm -f .config

          echo
          echo "Running defconfig..."

          make \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CC="$CC" \
            LD="$LD" \
            AR="$AR" \
            NM="$NM" \
            OBJCOPY="$OBJCOPY" \
            OBJDUMP="$OBJDUMP" \
            STRIP="$STRIP" \
            READELF="$READELF" \
            LLVM=1 \
            LLVM_IAS=1 \
            "$EXPECTED_DEFCONFIG"

          test -f .config

          echo
          echo "Defconfig generated successfully."

          echo
          echo "Important config:"
          grep -E \
            'CONFIG_ARM64=|CONFIG_ARCH_EXYNOS=|CONFIG_EXYNOS850=' \
            .config \
            || true

      # ============================================================
      # 15. SAVE CONFIGURED RELEASE
      # ============================================================
      - name: Verify configured kernel release
        env:
          KERNEL_DIR: ${{ steps.detect_root.outputs.kernel_dir }}
        shell: bash
        run: |
          set -euo pipefail

          cd "$KERNEL_DIR"

          CLANG_DIR="$KERNEL_DIR/toolchain/clang/host/linux-x86/clang-r383902"

          export PATH="$CLANG_DIR/bin:$PATH"

          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          KREL="$(
            make \
              ARCH=arm64 \
              CROSS_COMPILE="$CROSS_COMPILE" \
              CLANG_TRIPLE="$CLANG_TRIPLE" \
              CC="$CLANG_DIR/bin/clang" \
              LLVM=1 \
              LLVM_IAS=1 \
              LOCALVERSION="$LOCALVERSION" \
              kernelrelease
          )"

          echo "Kernel release:"
          echo "$KREL"

          case "$KREL" in
            4.19.198*)
              echo "Configured release: PASS"
              ;;
            *)
              echo "::error::Unexpected kernel release: $KREL"
              exit 1
              ;;
          esac

          echo "$KREL" > "$GITHUB_WORKSPACE/kernel-release.txt"

      # ============================================================
      # 16. BUILD KERNEL
      # ============================================================
      - name: Build kernel
        env:
          KERNEL_DIR: ${{ steps.detect_root.outputs.kernel_dir }}
        shell: bash
        run: |
          set -uo pipefail

          cd "$KERNEL_DIR"

          CLANG_DIR="$KERNEL_DIR/toolchain/clang/host/linux-x86/clang-r383902"

          export PATH="$CLANG_DIR/bin:$PATH"

          export ARCH=arm64
          export SUBARCH=arm64

          export PLATFORM_VERSION=14
          export ANDROID_MAJOR_VERSION=u

          export CROSS_COMPILE=aarch64-linux-gnu-
          export CLANG_TRIPLE=aarch64-linux-gnu-

          export CC="$CLANG_DIR/bin/clang"
          export LD="$CLANG_DIR/bin/ld.lld"
          export AR="$CLANG_DIR/bin/llvm-ar"
          export NM="$CLANG_DIR/bin/llvm-nm"
          export OBJCOPY="$CLANG_DIR/bin/llvm-objcopy"
          export OBJDUMP="$CLANG_DIR/bin/llvm-objdump"
          export STRIP="$CLANG_DIR/bin/llvm-strip"
          export READELF="$CLANG_DIR/bin/llvm-readelf"

          JOBS="${{ inputs.build_jobs }}"

          case "$JOBS" in
            ''|*[!0-9]*)
              JOBS=2
              ;;
          esac

          echo "=============================================="
          echo "BUILDING KERNEL"
          echo "=============================================="

          echo
          echo "Jobs:"
          echo "$JOBS"

          echo
          echo "Compiler:"
          "$CC" --version | head -2

          echo
          echo "Starting build..."

          make \
            ARCH=arm64 \
            CROSS_COMPILE="$CROSS_COMPILE" \
            CLANG_TRIPLE="$CLANG_TRIPLE" \
            CC="$CC" \
            LD="$LD" \
            AR="$AR" \
            NM="$NM" \
            OBJCOPY="$OBJCOPY" \
            OBJDUMP="$OBJDUMP" \
            STRIP="$STRIP" \
            READELF="$READELF" \
            LLVM=1 \
            LLVM_IAS=1 \
            LOCALVERSION="$LOCALVERSION" \
            -j"$JOBS" \
            2>&1 | tee "$GITHUB_WORKSPACE/kernel-build.log"

          BUILD_RC="${PIPESTATUS[0]}"

          if [ "$BUILD_RC" -ne 0 ]; then
            echo
            echo "::error::Kernel build failed with exit code $BUILD_RC"

            echo
            echo "Last 200 build log lines:"
            tail -200 "$GITHUB_WORKSPACE/kernel-build.log"

            exit "$BUILD_RC"
          fi

          echo
          echo "KERNEL BUILD FINISHED SUCCESSFULLY."

      # ============================================================
      # 17. VERIFY IMAGE
      # ============================================================
      - name: Verify kernel Image
        env:
          KERNEL_DIR: ${{ steps.detect_root.outputs.kernel_dir }}
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="$KERNEL_DIR/arch/arm64/boot/Image"

          echo "=============================================="
          echo "KERNEL IMAGE VERIFICATION"
          echo "=============================================="

          if [ ! -f "$IMAGE" ]; then
            echo "::error::Kernel Image was not generated."
            exit 1
          fi

          SIZE="$(stat -c%s "$IMAGE")"

          echo
          echo "Image:"
          echo "$IMAGE"

          echo
          echo "Image size:"
          echo "$SIZE bytes"

          if [ "$SIZE" -lt 1048576 ]; then
            echo "::error::Image is suspiciously small."
            exit 1
          fi

          echo
          echo "SHA256:"
          sha256sum "$IMAGE"

          echo
          echo "Image verification: PASS"

      # ============================================================
      # 18. COLLECT OUTPUTS
      # ============================================================
      - name: Collect kernel outputs
        env:
          KERNEL_DIR: ${{ steps.detect_root.outputs.kernel_dir }}
        shell: bash
        run: |
          set -euo pipefail

          OUT="$GITHUB_WORKSPACE/output"

          rm -rf "$OUT"
          mkdir -p "$OUT"

          echo "Collecting kernel outputs..."

          cp "$KERNEL_DIR/arch/arm64/boot/Image" \
             "$OUT/Image"

          cp "$KERNEL_DIR/.config" \
             "$OUT/config"

          if [ -f "$KERNEL_DIR/System.map" ]; then
            cp "$KERNEL_DIR/System.map" \
               "$OUT/System.map"
          fi

          if [ -f "$KERNEL_DIR/Module.symvers" ]; then
            cp "$KERNEL_DIR/Module.symvers" \
               "$OUT/Module.symvers"
          fi

          if [ -f "$KERNEL_DIR/vmlinux" ]; then
            cp "$KERNEL_DIR/vmlinux" \
               "$OUT/vmlinux"
          fi

          if [ -f "$KERNEL_DIR/arch/arm64/boot/dtbo.img" ]; then
            cp "$KERNEL_DIR/arch/arm64/boot/dtbo.img" \
               "$OUT/dtbo.img"
          fi

          mkdir -p "$OUT/dtb"

          find "$KERNEL_DIR/arch/arm64/boot" \
            -type f \
            \( -name "*.dtb" -o -name "*.dtbo" \) \
            -exec cp {} "$OUT/dtb/" \; \
            2>/dev/null || true

          cp "$GITHUB_WORKSPACE/kernel-release.txt" \
             "$OUT/kernel-release.txt"

          cat > "$OUT/BUILD_INFO.txt" <<EOF
          Device: Samsung Galaxy A13 SM-A135F
          Source: Official Samsung OpenSource
          Kernel: 4.19.198
          Defconfig: exynos850-a13xx_defconfig
          Localversion: -MAX-ARAF
          Compiler: Android Clang r383902
          Architecture: arm64
          Build: GitHub Actions
          EOF

          echo
          echo "Output files:"
          find "$OUT" -type f -printf "%p - %s bytes\n" | sort

      # ============================================================
      # 19. CREATE ZIP
      # ============================================================
      - name: Create kernel artifact ZIP
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          ZIP_NAME="A135F-Kernel-4.19.198-MAX-ARAF.zip"

          rm -f "$ZIP_NAME"

          cd output

          zip -r -9 \
            "$GITHUB_WORKSPACE/$ZIP_NAME" \
            .

          cd "$GITHUB_WORKSPACE"

          echo
          echo "=============================================="
          echo "FINAL ARTIFACT"
          echo "=============================================="

          ls -lh "$ZIP_NAME"

          echo
          echo "SHA256:"
          sha256sum "$ZIP_NAME"

      # ============================================================
      # 20. UPLOAD ARTIFACT
      # ============================================================
      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: A135F-Kernel-4.19.198-MAX-ARAF
          path: |
            A135F-Kernel-4.19.198-MAX-ARAF.zip
            kernel-build.log
            kernel-release.txt
          if-no-files-found: error
          compression-level: 0

      # ============================================================
      # 21. GITHUB SUMMARY
      # ============================================================
      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## A135F Kernel Build"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Device | Samsung Galaxy A13 SM-A135F |"
            echo "| Source | Official Samsung OpenSource |"
            echo "| Kernel | 4.19.198 |"
            echo "| Defconfig | exynos850-a13xx_defconfig |"
            echo "| Localversion | -MAX-ARAF |"
            echo "| Compiler | Android Clang r383902 |"
            echo "| Architecture | arm64 |"
          } >> "$GITHUB_STEP_SUMMARY"
